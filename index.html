<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TIB SAP Controls Interview Prep: Self-Guided Practice (Weeks 0 to 7)</title>
<style>
:root{--navy:#1F3A5F;--blue:#2F6DB5;--ink:#1d2733;--mut:#5b6775;--line:#d5dce5;--bg:#f4f6f9;--ok:#1e8a4c;--bad:#b3261e;--warn:#9a6a00;--sap:#dfe6ee}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Calibri,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header.top{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header.top b{font-size:15px}header.top small{opacity:.8}
header.top a.jr{margin-left:auto;margin-right:0;background:transparent;border:1px solid #ffffff88;color:#fff;border-radius:6px;padding:5px 10px;font-size:13px;text-decoration:none;white-space:nowrap}header.top a.jr+button{margin-left:0}
header.top button{margin-left:auto;background:transparent;border:1px solid #ffffff88;color:#fff;border-radius:6px;padding:5px 10px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:22px;color:var(--navy);margin:6px 0}h2{font-size:18px;color:var(--navy);margin:14px 0 6px}h3{font-size:15px;color:var(--navy);margin:12px 0 4px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.mut{color:var(--mut)}.small{font-size:13px}
.wk{margin:16px 0 4px;font-weight:700;color:var(--navy);text-transform:uppercase;font-size:12px;letter-spacing:.06em}
.ucard{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;cursor:pointer}
.ucard:hover{border-color:var(--blue)}.ucard.lock{opacity:.55;cursor:not-allowed}
.ucard .n{min-width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ucard.done .n{background:var(--ok)}
.ucard .t{flex:1}.ucard .t b{display:block}
.chip{font-size:11px;border-radius:10px;padding:2px 8px;background:#e8edf3;color:var(--mut);white-space:nowrap}
.chip.ok{background:#dff3e7;color:var(--ok)}
.steps{display:flex;gap:4px;overflow-x:auto;margin:8px 0;padding-bottom:2px}
.steps button{flex:1;min-width:84px;padding:8px 6px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer}
.steps button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps button.dn::after{content:" ✓";color:var(--ok);font-weight:700}.steps button.on.dn::after{color:#9be3b8}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--navy)}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callout{border-left:4px solid var(--blue);background:#eef4fb;padding:8px 12px;border-radius:0 8px 8px 0;margin:10px 0}
.callout.why{border-color:var(--warn);background:#fdf6e3}
.doc{max-width:820px;line-height:1.5}.doc p,.doc li{font-size:15px}.doc table.t{display:block;overflow-x:auto}@media print{header.top,.doc button{display:none}}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}table.t td,table.t th{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}table.t th{background:#eef2f7}
.task{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;background:#fff}
.task.ok{border-color:var(--ok);background:#f2faf5}
.task input[type=text],.task input[type=number]{padding:7px 9px;border:1px solid #aab4c1;border-radius:6px;font-size:14px;width:min(280px,100%)}
.fb{margin-top:6px;font-size:13px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.opt{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px;cursor:pointer}
.opt.sel{border-color:var(--blue);background:#eef4fb}.opt.right{border-color:var(--ok);background:#e9f7ef}.opt.wrong{border-color:var(--bad);background:#fdecea}
textarea{width:100%;min-height:110px;padding:8px;border:1px solid #aab4c1;border-radius:8px;font:inherit}
.kp label{display:block;padding:3px 0}
/* SAP simulator */
.simwrap{display:grid;gap:10px}
.coach{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.coach .st{font-size:12px;color:var(--mut)}.coach .say{font-weight:600;margin:4px 0}.coach .msg{font-size:13px;min-height:18px;color:var(--bad)}
.sap{border:1px solid #8a97a8;border-radius:6px;background:var(--sap);font:13px/1.35 Tahoma,Segoe UI,Arial,sans-serif;overflow:hidden;min-height:340px;display:flex;flex-direction:column}
.sap .menu{background:#c9d3df;padding:3px 8px;font-size:12px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid #9aa7b8}
.sap .menu span[data-id]{cursor:pointer}
.sap .tb{background:#e9eef4;padding:4px 6px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #9aa7b8}
.sap .tb input{flex:1;min-width:0;padding:3px 5px;border:1px solid #7d8b9c;background:#fff;font:inherit}
.sap .tb button{border:1px solid #7d8b9c;background:#f7f9fb;padding:2px 8px;cursor:pointer;font:inherit}
.sap .stitle{background:#f5f8fb;padding:6px 10px;font-weight:700;color:#0b3a6e;border-bottom:1px solid #b7c2d0}
.sap .body{padding:10px;background:#f5f8fb;flex:1;overflow:auto}
.sap .sbar{background:#c9d3df;padding:3px 8px;font-size:12px;border-top:1px solid #9aa7b8;color:#33404f}
.sap .f{display:grid;grid-template-columns:130px 1fr;gap:4px 8px;align-items:center;margin:4px 0;max-width:520px}
.sap .f input{padding:3px 5px;border:1px solid #7d8b9c;background:#fff;font:inherit;min-width:0}
.sap .f input[readonly]{background:#eaeff4}
.sap button.sb{border:1px solid #7d8b9c;background:#f7f9fb;padding:3px 10px;margin:4px 4px 4px 0;cursor:pointer;font:inherit}
.sap table{border-collapse:collapse;background:#fff;font-size:12px;width:100%}.sap td,.sap th{border:1px solid #c3ccd8;padding:3px 6px;text-align:left}.sap th{background:#e3e9f0}
.sap tr[data-id]{cursor:pointer}.sap tr[data-id]:hover td{background:#e6f0fb}
.sap .tabs{display:flex;gap:2px;border-bottom:1px solid #7d8b9c;margin:6px 0;flex-wrap:wrap}.sap .tabs span{padding:3px 10px;border:1px solid #9aa7b8;border-bottom:0;background:#e3e9f0;cursor:pointer}.sap .tabs span.on{background:#fff;font-weight:700}
.sap ul.tree{list-style:none;margin:0;padding-left:16px}.sap ul.tree li{padding:2px 0}.sap ul.tree li[data-id]{cursor:pointer;color:#0b3a6e}
.sap .red td{background:#fbe3e1}.sap .note{color:#33404f;font-size:12px;margin-top:6px}
.tgt{outline:3px solid #ff9f1a!important;outline-offset:1px;animation:pl 1.2s infinite}
@keyframes pl{50%{outline-color:#ffd28a}}
.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(min-width:600px){main{padding:16px}.simwrap{grid-template-columns:1fr}}
@media(min-width:880px){.simwrap{grid-template-columns:270px 1fr;align-items:start}.coach{position:sticky;top:60px}}
@media(max-width:599px){.sap .f{grid-template-columns:1fr}h1{font-size:19px}}
</style></head><body>

R1", "date": "2026-06-01", "by": "DEVELOPER1"}, {"k": "DEVK910312", "owner": "DEVELOPER1", "date": "2026-06-12", "by": "BASIS_ADM2"}, {"k": "DEVK910319", "owner": "FIN_CONFIG", "date": "2026-06-18", "by": "BASIS_ADM1"}, {"k": "DEVK910326", "owner": "FIN_CONFIG", "date": "2026-06-29", "by": "BASIS_ADM2"}], "nh": {"last": "2026-06-21", "term": "2026-06-12"}, "w2": {"ff": [{"id": "FF4400", "ff": "FF_EMER01", "user": "DPATEL", "d": "2026-07-02", "reason": "Close period posting block", "act": "OB52 period open"}, {"id": "FF4401", "ff": "FF_EMER02", "user": "AHUGHES", "d": "2026-07-05", "reason": "Transport import fix", "act": "STMS import"}, {"id": "FF4402", "ff": "FF_EMER02", "user": "AHUGHES", "d": "2026-07-11", "reason": "Correct master data error", "act": "XK02 vendor change"}, {"id": "FF4403", "ff": "FF_EMER01", "user": "DPATEL", "d": "2026-07-14", "reason": "Unlock user after failed logons", "act": "FB01 journal posting; SU01 user unlock"}, {"id": "FF4404", "ff": "FF_EMER01", "user": "CMENDEZ", "d": "2026-07-19", "reason": "Unlock user after failed logons", "act": "SU01 user unlock"}, {"id": "FF4405", "ff": "FF_EMER01", "user": "CMENDEZ", "d": "2026-07-23", "reason": "Fix stuck payment run", "act": "F110 payment run restart"}], "mit": {"user": "EROSSI", "risk": "R1", "ctrl": "Review of all vendor bank-detail changes before each payment run", "to": "31.08.2026"}, "sod": {"user": "CMENDEZ"}, "ipe": {"report": 1168226.51, "gl": 1368659.84}, "unrem": "QMURPHY", "rem": "LFISCHER", "gl_rows": [["1000", 394481.11], ["1100", 378726.56], ["1200", 395018.84], ["1300", 200433.33]], "rep_rows": [["1000", 394481.11], ["1100", 378726.56], ["1200", 395018.84]]}, "w3": {"rows_im": [[1900002005, "V106", 99.93, 108.92, "Posted after release", "AP_MGR", "APR-0412"], [1900002012, "V113", 320.14, 342.55, "Posted after release", "AP_CLERK1", ""], [1900002018, "V119", 396.25, 396.25, "Posted after release", "AP_CLERK1", ""], [1900002025, "V107", 349.27, 391.18, "Posted", "", ""], [1900002031, "V113", 290.21, 319.23, "Posted", "", ""], [1900002036, "V118", 313.0, 341.17, "Posted", "", ""]], "pi": [["PR-2026-05", 407, 404, 1067809.17, 1049389.07], ["PR-2026-09", 413, 413, 1115926.86, 1109616.86]], "mg_diff": [["113100", "1000", 1520300.0, 1568600.0], ["160000", "1000", 1368659.84, 1367409.84], ["210000", "1000", 884120.5, 893901.05]], "lc": [["GL balances", 412, 412], ["Vendor master", 3208, 3208], ["Customer master", 5410, 5410], ["Open AP items", 1842, 1839], ["Open AR items", 2975, 2975], ["Fixed assets", 1204, 1204], ["Inventory", 8640, 8640]]}, "w4": {"cc": [["V202", "2026-04-07", "2026-04-09", "N", 39144.63], ["V205", "2026-05-31", "2026-06-03", "N", 22811.3], ["V208", "2026-07-24", "2026-07-25", "Y", 26726.64], ["V210", "2026-08-29", "2026-09-01", "Y", 57096.45]], "al": [["A001", "V202", "2026-04-09", "Open"], ["A002", "V205", "2026-06-03", "Closed"], ["A003", "V208", "2026-07-25", "Open"]]}}, "QS": {"1": {"title": "The ITGC domains in an SAP landscape", "question": "“Walk me through the IT general control domains you would test in an SAP S/4HANA landscape, and why each one matters to the financial statements.”", "answer": "I group SAP ITGCs into three domains. First, access to programs and data: user provisioning, leavers, periodic access reviews, privileged access such as SAP_ALL or firefighter IDs, and password and system parameter settings. If access is weak, someone could post or change financial data without authority. Second, program change: changes move from development to quality to production through transports, with approval, testing and segregation between developers and the people who import into production. If change is weak, a configuration or code change could break an automated control without anyone noticing. Third, IT operations: batch job scheduling and monitoring in SM37, interface monitoring, and backup and recovery. If operations fail, transactions can be missed or duplicated. Some firms add a fourth domain, program development, for new implementations. The reason all of this matters is reliance: the external auditor relies on automated controls and system-generated reports, and that reliance is only valid if the ITGCs around them operated effectively for the whole period.", "key": ["Access to programs and data, including privileged access", "Program change through transports with approval and segregation", "IT operations: batch jobs, interfaces, backups", "Links ITGCs to reliance on automated controls and reports", "Gives SAP-specific examples (SAP_ALL, SM37, transports)"]}, "2": {"title": "Change management and transports", "question": "“How does change management work in SAP, and how would you test it, including emergency changes?”", "answer": "In SAP, changes are built in development, tested in quality and imported into production through transports, managed in STMS. To test it, I take the population of transports imported into production for the period from the import history or the transport tables, because a ticket-based population would miss unauthorized changes. I sample transports and trace each to an approved change request, checking that approval and testing happened before the import date, and that the developer did not import their own change. I also check that production is protected against direct changes: the client settings in SCC4 and the system change option in SE06 should not allow changes in production, and I look at the change logs for any time they were opened. Emergency changes follow a faster path, so I test that each one was logged, reviewed and approved after the fact within the agreed time. Finally I check who can import transports and who has developer keys in production, because that access can bypass the whole process.", "key": ["DEV to QAS to PRD via transports and STMS", "Population from transport logs, not tickets", "Approval and testing before import", "Segregation: developer does not import own change", "Production locked: SCC4 and SE06, with change logs", "Emergency changes with retrospective approval"]}, "3": {"title": "Privileged access and SAP_ALL", "question": "“You find five users with SAP_ALL in production. What do you do?”", "answer": "First I confirm the facts: which users, whether the profile is active and valid, when it was assigned and by whom, using SUIM and the user change documents. I separate expected cases, such as an emergency firefighter ID locked by default, from real issues, such as named dialog users who hold SAP_ALL permanently. For any real issue I find out the business reason and who approved it. Then I look at what those users actually did: the security audit log in SM20 if it is active, and change documents for sensitive tables and master data. If I cannot show what was done, that gap is itself a problem. I raise it with my lead the same day, because permanent SAP_ALL in production undermines both access and change controls, and it may affect reliance on other controls. The usual remediation is to remove the profile, move genuine emergency needs to a firefighter process with logging and review, and assess whether the access was misused during the period.", "key": ["Confirm facts in SUIM and change documents", "Separate locked emergency IDs from real issues", "Review what the users did (SM20, change documents)", "Escalate to the lead promptly", "Assess impact on reliance on other controls", "Remediate via firefighter process"]}, "4": {"title": "Explaining segregation of duties", "question": "“Explain segregation of duties to someone outside audit, and give me a real SAP example of a conflict.”", "answer": "Segregation of duties means no single person should be able to start, approve and hide a transaction on their own, because that creates the chance for fraud or error without anyone noticing. A classic SAP example is in purchase to pay: if one user can create or change a vendor master record, for example in transaction XK02 or the business partner transaction, and can also run the payment program in F110, they could change a vendor's bank details to their own account and pay it. In SAP GRC Access Control this shows up as a risk in the ruleset, made of two functions, vendor maintenance and payment processing, each with their actions and permissions. When I find a conflict I look at whether it is real, whether the access is used, and whether there is a mitigating control, such as a review of vendor bank changes before each payment run.", "key": ["Plain-language definition: no one person can start, approve and conceal", "Concrete SAP example (vendor maintenance plus payment run)", "Business risk explained (fraudulent payment)", "Ruleset terms: risk, functions, actions", "Next steps: is it used, is it mitigated"]}, "5": {"title": "Emergency access and firefighter review", "question": "“How should emergency access (firefighter) work in SAP, and how would you test the review of firefighter sessions?”", "answer": "Emergency access gives temporary, powerful access for urgent fixes, so it needs strong controls around it. In GRC Emergency Access Management, users request a firefighter ID with a reason; the session is logged, including transactions run and changes made; and a controller, who is independent of the user, reviews the log within an agreed time, often a few days. To test it, I get the population of all firefighter sessions in the period from GRC, check it is complete against the firefighter log reports, and select a sample. For each one I check there was a valid reason linked to a ticket, that the activity matched the reason, that the controller reviewed and signed off on time, and that anything unexpected was followed up. I also check who is assigned as owner and controller, that controllers are not reviewing themselves, and who can use firefighter IDs at all.", "key": ["Request with reason and ticket", "Session logging of transactions and changes", "Independent controller review within agreed time", "Population from GRC logs, checked for completeness", "Activity matches stated reason", "Owner and controller assignments checked"]}, "6": {"title": "Design versus operating effectiveness", "question": "“What is the difference between testing a control's design and testing its operating effectiveness? Give an SAP example of each.”", "answer": "Design is whether the control, if it works as described, would prevent or detect the risk. Operating effectiveness is whether it actually worked consistently throughout the period. I test design first, usually with a walkthrough: I follow one transaction end to end, inspect the evidence and confirm the control addresses the risk at the right precision. For example, for a vendor bank change review, I check that the review covers all bank changes, is done by someone independent, and happens before the payment run. Then I test operating effectiveness with a sample over the period, for example two quarters of the review if it is quarterly, or 25 instances if it happens several times a day. If the design fails, there is no point testing operation; I raise it as a design deficiency with my lead straight away, because it means the risk is not covered at all.", "key": ["Design: would it address the risk", "Operating effectiveness: did it work all period", "Walkthrough supports design", "Sample over the period for operation", "SAP example", "Design failure means escalate, no operating test"]}, "7": {"title": "What makes a good workpaper", "question": "“What makes a good controls testing workpaper? What would make a reviewer send it back?”", "answer": "A good workpaper lets an experienced reviewer who was not there understand what I did, re-perform it and reach the same conclusion without calling me. It has a clear structure: the control and the risk it addresses, the test objective, where the population came from and how I checked it was complete, how the sample was selected, the test steps, the result for each sample with the evidence cross-referenced, any exceptions and how I evaluated them, and a conclusion that answers the objective. It is signed and dated by the preparer and the reviewer. A reviewer sends it back when the population source is missing, when evidence does not match the sample, when exceptions are described as 'minor' without analysis, when screenshots have no date or system shown, or when the conclusion says effective but the results show a failure. I write each workpaper as if the external auditor will read it, because they often do.", "key": ["Stands alone and can be re-performed", "Control, risk and objective stated", "Population source and completeness", "Sample selection method", "Per-sample results with cross-referenced evidence", "Exceptions evaluated and conclusion matches results", "Preparer and reviewer sign-off"]}, "8": {"title": "Handling an exception", "question": "“You find an exception in your sample. Take me through exactly what you do next.”", "answer": "First I make sure it is really an exception: I recheck the evidence and ask the control owner for anything I might have missed, with a deadline. If it stands, I document it straight away: what failed, which sample, the date, and what the evidence shows. Then I work out the root cause, because that tells me whether it is a one-off, such as a reviewer on holiday with no backup, or a systemic problem, such as a control that never covered a whole entity. Depending on the methodology, I discuss with my lead whether to extend the sample or conclude the control is not effective. I also look for compensating controls that might reduce the risk, and I consider the impact on other controls that depend on this one. I tell my lead the same day, with the facts, my initial view on severity and the options. I never wait until the end of testing to raise an exception, and I never let the control owner fix the evidence after the fact.", "key": ["Confirm with the control owner, with a deadline", "Document immediately", "Find the root cause: isolated or systemic", "Extend sample or conclude, per methodology", "Consider compensating controls and dependencies", "Escalate to the lead the same day with options", "No after-the-fact evidence fixes"]}, "9": {"title": "Pushback from a control owner", "question": "“Tell me about a time a control owner pushed back on your finding. How did you handle it? If you have not had this yet, tell me how you would handle it.”", "answer": "Example story, to replace with your own real one: on a recent engagement, a finance manager disagreed that her monthly journal review had failed, because she said she always reviewed the journals even if she did not sign. I prepared before the meeting: the control description, which required evidence of review, and the three months with no sign-off. In the meeting I started by agreeing the shared goal, a clean result for her team, and then walked through the facts without blaming anyone. I asked whether there was any other evidence, such as emails with questions on specific journals. She found one month's emails, which I accepted and documented; the other two months remained exceptions. We agreed the root cause, the control required a sign-off she did not know about, and she proposed a simple fix: sign-off in the workflow tool. I kept my lead informed throughout, so there were no surprises. The result was a fair finding she accepted, and a stronger control the next quarter. If I had not had a real example, I would describe the same approach: prepare, listen, stay on the facts, accept new evidence, and escalate if we cannot agree.", "key": ["Structured story (situation, action, result)", "Prepared evidence in advance", "Respectful, fact-based, shared goal", "Listened and accepted valid new evidence", "Agreed root cause and fix", "Kept the lead informed; escalate if needed"]}, "10": {"title": "What an application control is", "question": "“What is an IT application control? Give me two examples from SAP and explain how they differ from manual controls.”", "answer": "An IT application control is a control built into the system that runs automatically every time a transaction is processed, so it does not depend on a person remembering to do it. Two SAP examples: the three-way match in purchasing and invoice verification, where SAP blocks an invoice for payment if price or quantity differ from the purchase order and goods receipt beyond a set tolerance; and posting period control, where configuration in OB52 stops users from posting to closed periods. The key differences from manual controls are consistency and testing approach. A manual control can fail on any day, so we test a sample across the year. An automated control behaves the same way every time, so if the ITGCs over change management and access are effective, I can test it once per scenario and then confirm the configuration did not change during the period. If the ITGCs are weak, that assumption falls away and I need much more testing.", "key": ["Configured in the system, runs every time", "SAP examples: three-way match tolerances, OB52 posting periods", "Contrast with manual controls", "Test once per scenario plus configuration unchanged", "Reliance depends on effective ITGCs"]}, "11": {"title": "Interface controls", "question": "“A third-party payroll system sends journal entries into SAP every two weeks. What controls would you expect and how would you test them?”", "answer": "I would expect controls in four places. At the source, the payroll results are approved before they are sent. In transit, control totals such as record count and total amount are sent with the file and checked by SAP on receipt, and the file is protected from changes. On receipt, interface errors are logged and monitored, for example in the interface or IDoc monitoring, and every error is fixed and reprocessed. And afterwards, a reconciliation between the payroll register and what posted in the SAP ledger, reviewed and signed by someone in finance. To test, I walk through one payroll run end to end, then test a sample of runs: control totals agreed, errors resolved, and the reconciliation done on time with differences explained. I also check who can change the interface mapping or the batch job, because that is a change management and access risk, and I consider whether the payroll provider's SOC 1 covers the source side.", "key": ["Approval at source", "Control totals checked on receipt", "Error monitoring and reprocessing", "Reconciliation reviewed by finance", "Access and change control over the interface", "Link to the provider's SOC 1"]}, "12": {"title": "SOX 302 and 404 in plain terms", "question": "“What do sections 302 and 404 of Sarbanes-Oxley require, and where do IT controls fit?”", "answer": "Section 302 requires the CEO and CFO of a US-listed company to personally certify each quarterly and annual report, including that they are responsible for internal controls and have disclosed significant deficiencies and material weaknesses. Section 404 has two parts: 404(a) requires management to assess and report on the effectiveness of internal control over financial reporting each year, and 404(b) requires the external auditor of larger companies to give its own opinion on those controls. IT controls fit in because almost every financial process runs through systems like SAP. Automated controls and system reports are only reliable if the IT general controls around them work, so ITGCs and application controls are tested as part of the 404 programme. In practice, my testing either supports management's assessment or is used, or re-performed, by the external auditor, which is why the evidence and documentation have to stand up to scrutiny.", "key": ["302: CEO and CFO certification each quarter", "404(a): management's assessment", "404(b): external auditor's opinion for larger filers", "IT controls support reliance on systems", "Testing must meet external audit standards"]}, "13": {"title": "The COSO framework", "question": "“Walk me through the COSO 2013 framework. Which parts matter most for an IT controls consultant?”", "answer": "COSO 2013 is the framework most US companies use for internal control over financial reporting. It has five components: control environment, risk assessment, control activities, information and communication, and monitoring activities, supported by 17 principles. For an IT controls consultant, the most direct link is control activities, and in particular principle 11, which says the organization selects and develops general control activities over technology, which is where ITGCs sit. But the others matter too. Risk assessment drives which systems are in scope. Information and communication covers the quality of information used in controls, which is where testing the completeness and accuracy of system reports comes in. And monitoring covers ongoing and separate evaluations, such as access reviews and control self-assessments. When a deficiency is evaluated, the auditor also considers the control environment, for example whether management overrides controls.", "key": ["Five components named correctly", "17 principles", "Principle 11: general controls over technology", "Information quality links to report testing", "Monitoring and control environment also relevant"]}, "14": {"title": "Lines of defence and who does what", "question": "“Explain the Three Lines model. Where do you sit as a controls consultant, and how do you work with internal and external audit?”", "answer": "The Three Lines model separates responsibilities. The first line is management and the control owners who run the business and operate the controls. The second line is functions such as risk management, compliance and often the SOX programme office, which set frameworks and monitor. The third line is internal audit, which gives independent assurance to the board. The external auditor sits outside the organisation and gives its own opinion. As a controls consultant, where I sit depends on the engagement: helping the SOX office design and test controls puts me in a second-line role, while supporting internal audit testing puts me in a third-line role. Either way I work closely with the external auditor: I agree the plan, sample sizes and evidence standards at the start, so they can rely on our testing where allowed. I also guard independence, for example I do not test controls I designed, and I do not operate controls on the client's behalf.", "key": ["First, second and third lines explained", "External auditor outside the model", "Consultant's position depends on the engagement", "Agree plan and reliance with external audit early", "Protect independence: no testing own design, no operating controls"]}, "15": {"title": "How S/4HANA changes the control landscape", "question": "“What changes for controls when a company moves from SAP ECC to S/4HANA?”", "answer": "Several things change. The data model is simplified: the Universal Journal brings finance and controlling postings into one table, so reports and reconciliations that relied on old tables must be rebuilt and re-tested. Users increasingly work in Fiori apps rather than SAP GUI transactions, so access risk now involves Fiori catalogs, the OData services behind the apps and the backend roles, and the SoD ruleset must include Fiori apps and services. Business partner replaces separate vendor and customer master transactions, so master data controls move. Many companies also move to RISE with SAP, which shifts infrastructure and Basis controls to SAP and brings SOC 1 reliance into scope. And the migration itself is a risk: data must be complete and accurate in the new system. The opportunity is that S/4HANA offers more embedded analytics and automation, so some manual controls can become automated or be replaced with continuous monitoring.", "key": ["Universal Journal changes reports and reconciliations", "Fiori apps, OData services and backend roles", "SoD ruleset updated for Fiori", "Business partner replaces vendor and customer master", "RISE shifts controls and brings SOC 1 reliance", "Data migration risk", "Opportunity to automate controls"]}, "16": {"title": "Reading a functional design document", "question": "“You receive a functional design document for a new custom report used in a key control. What do you look for?”", "answer": "I read it with the control in mind. First, the purpose: does the report give the control owner what they need to perform the control, at the right precision? Second, the data sources: which tables and fields, and do they capture all relevant transactions, including any new S/4HANA structures. Third, the selection screen: which parameters can users change, and could someone exclude data without it being obvious, for example a default date range or company code filter. Fourth, the logic: calculations, groupings and exception rules, written clearly enough to test. Fifth, security: whether the report checks authorizations, so users only see what they should. Sixth, the test plan: I want test cases that prove completeness and accuracy, including a reconciliation to a standard report. I feed any gaps back to the functional team before build, because fixing a design is far cheaper than failing the report as unreliable evidence at the first audit.", "key": ["Purpose matches the control's need", "Data sources complete", "Selection parameters that could exclude data", "Clear, testable logic", "Authorization checks in the report", "Test plan proving completeness and accuracy", "Feed back before build"]}, "17": {"title": "SOC 1 Type I versus Type II", "question": "“What is the difference between a SOC 1 Type I and a Type II report, and which do you need for SOX?”", "answer": "A SOC 1 reports on controls at a service organization that are relevant to its clients' financial reporting. A Type I gives an opinion on whether those controls were suitably designed and implemented as of a single date. A Type II goes further: it covers design and operating effectiveness over a period, usually six to twelve months, and lists the service auditor's tests and results control by control. For SOX reliance over a fiscal year I need a Type II, ideally covering most of the year. A Type I only shows the controls existed on one day, so it is acceptable at most as a stop-gap, for example in a provider's first year, with extra procedures agreed with the external auditor. I also make sure nobody accepts a SOC 2 in its place, because SOC 2 reports on security and availability criteria, not financial reporting control objectives.", "key": ["SOC 1 relates to clients' financial reporting", "Type I: design at a point in time", "Type II: operating effectiveness over a period with tests", "Type II needed for SOX reliance", "Type I only a stop-gap", "SOC 2 is not a substitute"]}, "18": {"title": "RISE with SAP: who controls what", "question": "“A client has moved to RISE with SAP. How does that change the ITGC scope, and what stays with the client?”", "answer": "With RISE, SAP takes over the infrastructure, hosting, database and operating system administration, backups and much of the technical Basis work for the private cloud environment. Those controls move out of the client's direct testing scope and are evidenced instead by SAP's SOC 1 Type II report for the service, which customers can obtain through the SAP Trust Center. What stays with the client is significant: user and role administration inside the SAP application, SoD and access reviews, approval and testing of changes before they are imported, the configuration of business controls, and monitoring SAP as a provider. So in scoping I map which ITGCs are now SAP's, read the SOC 1 for those, map its complementary user entity controls to the client's controls, and keep full testing on the controls the client still owns. A common mistake is assuming RISE covers user access. It does not.", "key": ["SAP: infrastructure, database, OS, backups, much of Basis", "Evidence via SAP's SOC 1 Type II (Trust Center)", "Client keeps application security and SoD", "Client keeps change approval and business configuration", "Map CUECs", "RISE does not cover user access"]}, "19": {"title": "Where AI helps in control testing", "question": "“How are you using, or would you use, AI in control testing, and where would you not trust it?”", "answer": "I use AI where there is volume and pattern work. For example, triaging hundreds of SoD conflicts into mitigated, unused and active groups using the GRC export and usage data; matching transports imported to production against change tickets; and drafting test steps or workpaper wording from my notes. It saves hours and lets me spend time on judgement. Where I do not trust it is anything that needs to be proven or judged. An AI statement is never evidence; the system report is. It can invent an answer if the data it needs is missing, so I tell it to use only the data I give it and to list anything it cannot decide. And severity of a deficiency is a professional judgement that stays with me and my lead. I always verify a sample of its output in SAP, save the prompt and output with the workpaper, and only use tools the firm and client have approved, with personal data masked.", "key": ["Concrete uses: SoD triage, transport matching, drafting", "AI output is not evidence", "Risk of invented answers; use only supplied data", "Severity judgement stays human", "Verify a sample in SAP", "Approved tools and masked data; save prompt and output"]}, "20": {"title": "Continuous controls monitoring", "question": "“What is continuous controls monitoring, and how could it be used in an SAP environment?”", "answer": "Continuous controls monitoring means using automated rules to check transactions, configuration or access frequently, often daily, instead of relying on periodic manual reviews or year-end sampling. Exceptions are sent to an owner who must investigate and close them. In SAP it can be done with SAP Process Control, with GRC Access Control alerts, or with analytics tools on extracted data. Examples include flagging changes to vendor bank details followed by a payment within a few days, monitoring for new SoD conflicts or firefighter use, detecting duplicate invoices, and alerting on changes to key configuration such as tolerances or posting periods. For it to work as a control, the rules must be designed and tested, the data feeding them must be complete, and every exception must be worked and evidenced. Otherwise it becomes a report nobody reads. Done well, it lets a company replace some manual controls and find problems in days rather than at year end.", "key": ["Automated, frequent checks with exceptions to owners", "SAP options: Process Control, GRC alerts, analytics", "Concrete SAP examples", "Rules designed and tested, data complete", "Exceptions worked and evidenced", "Benefit: faster detection, fewer manual controls"]}, "21": {"title": "Tell me about yourself", "question": "“Tell me about yourself and why you want this controls role.”", "answer": "A strong answer follows past, present and future in about two minutes. Example, to adapt with your own details: 'I started my career in finance operations, where I worked with SAP every day and saw how a small control failure, such as a missed vendor bank check, could turn into a real loss. That got me interested in controls. Over the past year I have trained in SAP controls testing: I have tested ITGCs and segregation of duties on a live SAP lab system, worked through 90 audit procedures with evidence packs, and practised SOC 1 reviews and AI-assisted testing. What I enjoy most is finding the root cause of a control gap and helping the business fix it in a practical way. I am applying for this role because your team works on SAP S/4HANA and GRC, which is exactly where I want to build my career, and I would bring both a business view and hands-on testing skills from day one.'", "key": ["Past, present, future structure", "About two minutes", "Concrete relevant skills and training", "Clear reason for the move", "Links to this employer and role", "Enthusiasm for the work"]}, "22": {"title": "Explaining a finding to a senior executive", "question": "“How would you explain a significant control finding to a CFO who has five minutes and no IT background?”", "answer": "I would lead with the business impact, not the technical detail, and keep it to four points. What happened: 'Five people in IT could change vendor bank details and approve payments without anyone checking.' Why it matters: 'That means a fraudulent payment could have been made without being caught; we found no evidence it happened, but we cannot rely on the control this year.' What is being done: 'Access has been removed, a daily review of bank changes starts next week, and we are checking every bank change made this year.' What I need: 'Your support for the finance team to complete that review by month end, and awareness that this may be reported to the audit committee as a significant deficiency.' I would have the detail ready if asked, but I would not start with transaction codes or authorization objects. Executives remember the risk, the action and the ask.", "key": ["Business impact first, no jargon", "What happened", "Why it matters in risk or money terms", "What is being done", "What you need from them", "Detail ready if asked"]}, "23": {"title": "Disagreement with the external auditor", "question": "“The external auditor disagrees with your conclusion that a control is effective. How do you handle it?”", "answer": "I start by understanding exactly what concerns them: is it the design, the evidence, the sample, or how I evaluated an exception? I ask them to point to the specific gap, and I take it seriously, because they may have seen something I missed. Then I go back to the workpaper and evidence. If they are right, I say so, correct the conclusion and fix the root cause in our approach. If I still believe the control is effective, I set out the facts calmly: the control design, the evidence for each sample and how it meets the methodology, and anything that addresses their concern. Often more evidence or a short extra test resolves it. I bring my lead in early rather than at the end, and if we still disagree, the lead and the auditor's manager resolve it. I document the discussion and the outcome in the workpaper. The relationship matters for the whole engagement, so I keep the tone collaborative: we both want a reliable conclusion.", "key": ["Understand the specific concern", "Re-examine the evidence honestly", "Accept if they are right", "Present facts calmly if not", "Extra evidence or test can resolve", "Bring the lead in early; escalate properly", "Document the outcome; keep it collaborative"]}, "24": {"title": "Moving into controls without a Big 4 background", "question": "“You do not have a Big 4 audit background. Why should we hire you for a controls role?”", "answer": "I would answer the gap directly and then show evidence. 'You are right that I have not worked at a Big 4 firm. What I have done is learn and practise the same work: I have tested ITGCs and segregation of duties on a live SAP lab system, worked through 90 SAP audit procedures with worked examples and evidence packs, written a SOC 1 reliance memo, and practised the deficiency evaluation and remediation steps your team carries out. I bring something extra as well: I have worked inside the business with SAP, so I understand how control owners think and what makes a control practical rather than theoretical. That helps me get evidence on time and recommend fixes that actually get implemented. I know every firm has its own methodology, and I am used to learning structured methods quickly. I would welcome a test of my skills, for example a short case on a user access review.'", "key": ["Acknowledges the gap directly", "Concrete evidence of hands-on testing", "Knows the methodology steps", "Business-side strength as a differentiator", "Quick learner of firm methodology", "Offers to be tested"]}, "25": {"title": "Working under pressure and deadlines", "question": "“Tell me about a time you had too much to do before a deadline. How did you decide what to do first?”", "answer": "Use the situation, task, action, result structure with your own example. Model: 'Two weeks before a quarter-end testing deadline, I had twelve controls left and two of my evidence providers were on leave. I listed the controls and ranked them by risk and by how close they were to done; the key access and change controls came first because other controls depended on them. I told my lead the same day which three controls were at risk and proposed a plan: I would finish the high-risk ones first, ask the providers' backups for evidence, and move two low-risk controls to the following week with the auditor's agreement. I blocked time for focused testing and kept a short daily update. We concluded ten controls on time, including all the high-risk ones, and the other two a week later with no surprises for the auditor. What I learned is to raise risk early, because it gives everyone options.'", "key": ["STAR structure", "Prioritised by risk and dependency", "Told the lead early with a plan", "Used alternatives (backups)", "Agreed changes with the auditor", "Quality kept on high-risk work", "Clear result and lesson"]}, "26": {"title": "Your questions for the interviewer", "question": "“Do you have any questions for us?”", "answer": "Always have three or four questions ready, tailored to the interviewer. Strong examples: 'What would success look like in this role after the first 90 days?' 'Which SAP systems and GRC tools does the team work with today, and are there changes coming, such as a move to S/4HANA or RISE?' 'What are the biggest control challenges the team is facing this year?' 'How does the team work with the external auditor, and how much do they rely on your testing?' 'How is the team using AI or automation in testing, and where do you want to go next?' For a supervisor: 'How do you like updates and questions from your team?' Save questions about salary and benefits for the recruiter or a later stage. End by thanking them and briefly restating why you are a good fit.", "key": ["Never say 'no questions'", "Ask about success in 90 days", "Ask about systems, tools and upcoming changes", "Ask about challenges and the external auditor", "Ask about AI and automation", "Tailor to the interviewer; save pay for later", "Close with thanks and fit"]}, "27": {"title": "Testing user provisioning", "question": "“How would you test the user provisioning control in SAP? Take me from the population to your conclusion.”", "answer": "I start by getting the population from SAP itself: all users created, and all role assignments added, during the period. I use the user master data in USR02 for creation dates and the change documents for role assignments, run through SUIM or the GRC reports, and I record the parameters and run date so the population can be re-created. I check completeness by comparing the count with a second view of the same data. Then I select a sample using our sampling guidance, typically 25 for a control that happens many times a day. For each sample I trace back to the access request: was there a request, was it approved by the right person, was the approval before the access was granted, and does the access actually given match what was approved. If GRC Access Request Management is used, I also check that the risk analysis was run and any conflicts were mitigated before approval. I document each sample with screenshots or exports, and I conclude on design and operating effectiveness. Any sample that fails becomes an exception that I evaluate, not one I explain away.", "key": ["Population from SAP, not the ticketing tool", "Completeness and accuracy of the population", "Sample size from methodology", "Approval before access, by the right approver", "Access granted matches access approved", "Risk analysis checked before approval when GRC is used"]}, "28": {"title": "Testing leavers and terminations", "question": "“A client says its leaver process is fully automated from HR. How would you test that terminated employees lose SAP access on time?”", "answer": "Automated or not, I test it. I get a list of everyone who left during the period from the HR system, and I check that the list itself is complete, for example by agreeing headcount movements. I then compare it with SAP: for each leaver, when was the user locked or the validity date ended, and was that within the client's policy, often one or three business days. Because the process is automated, I also look at the automated part as an application control: how the HR interface triggers the lock, and whether that configuration changed during the year. For any leaver whose access stayed open too long, I check the last logon date and the change documents to see whether the account was used after the leave date. Late removal with no use is still an exception, but a much lower risk than late removal with activity. I also look for accounts not linked to HR at all, such as contractors and generic IDs, because the automated process usually does not cover them.", "key": ["Independent HR leaver population, checked for completeness", "Compare with SAP lock or validity date against policy", "Test the automation as an application control", "Check use after leave date via last logon", "Look for contractors and generic IDs outside HR"]}, "29": {"title": "IT operations: batch jobs and interfaces", "question": "“Which IT operations controls matter for financial reporting in SAP, and how would you test batch job monitoring?”", "answer": "The operations controls that matter are the ones that make sure financial transactions are processed completely and only once: scheduled batch jobs such as payment runs, depreciation, interest calculation and interfaces from other systems, plus backup and recovery. For batch job monitoring I first identify the jobs that are financially relevant, with the process owners. Then I check who can schedule or change those jobs, because that is an access risk. To test monitoring, I take the list of failed or cancelled jobs from SM37 for the period, sample them, and confirm each failure was noticed, investigated and resolved, for example through an incident ticket and a rerun. For interfaces I do the same with the interface monitoring tool or error logs, and I check that reconciliations between source and SAP happen. I also confirm that backups run and that a restore has been tested, because a backup that has never been restored is an assumption, not a control.", "key": ["Focus on financially relevant jobs and interfaces", "Access to schedule or change jobs", "Failed jobs from SM37 traced to resolution", "Interface errors and reconciliations", "Backups plus tested restores"]}, "30": {"title": "How access risk analysis works in GRC", "question": "“How does access risk analysis work in SAP GRC Access Control, and what makes the results reliable?”", "answer": "GRC compares each user's or role's authorizations against a ruleset. The ruleset defines risks; each risk is a combination of functions, each function is a set of actions such as transaction codes, and each action can be refined with permission values, such as an authorization object and activity. Analysis can run at action level, which is broader, or at permission level, which is more precise and reduces false positives. For results to be reliable, three things must be true. The ruleset must be complete and approved, and changes to it must go through change control, because deleting a risk makes conflicts disappear. The repository and authorization sync jobs must have run successfully, otherwise GRC is analysing old data. And the analysis must cover all relevant systems and users, including firefighter IDs and service accounts. When I test, I check all three before I rely on any report, and I re-run analysis for a sample of users to confirm the output.", "key": ["Ruleset: risks, functions, actions, permissions", "Action level versus permission level", "Ruleset change control", "Sync jobs must run for current data", "Coverage of all systems and user types", "Re-run a sample to confirm"]}, "31": {"title": "Mitigating controls", "question": "“A business owner wants to keep a conflicting role assignment and says there is a mitigating control. How do you decide whether to accept that?”", "answer": "I accept the business reason as a starting point, then test the mitigation like any other control. First, does it actually address the specific risk? A general monthly review of expenses does not mitigate the risk of changing vendor bank details and paying them; a review of all vendor bank changes before each payment run does. Second, is it performed by someone independent of the user with the conflict? Third, is it precise enough and frequent enough to catch the problem in time? Fourth, is there evidence that it happened, every period, for the whole year? In GRC I also check that the mitigating control is assigned to that user and risk, with a valid date range and an owner, and that monitors are notified. If all of that holds, the conflict is accepted as mitigated and documented. If not, the options are to remove the access, split the role, or design a proper mitigation, and the business owner signs off on whichever is chosen.", "key": ["Mitigation must address the specific risk", "Performed independently", "Precise and frequent enough", "Evidence for every period", "Assigned in GRC with valid dates and owner", "Otherwise remove, split or redesign"]}, "32": {"title": "User access reviews that actually work", "question": "“What makes a periodic user access review effective, and what are the common reasons auditors fail it?”", "answer": "An access review works when the right person reviews a complete and understandable list and the changes they ask for actually happen. Auditors fail reviews for four common reasons. The list was incomplete, for example missing service accounts or a second system, so I compare the list given to reviewers with a system extract from the same date. The reviewer could not understand it, for example role names with no description, so they approved everything; I look for evidence of real review, such as some removals or questions. The review was late or not signed off. And requested removals were never processed, so I trace a sample of removals to SAP change documents. A good design also covers privileged and firefighter access separately, and has the reviewer be someone who knows the job, usually the line manager or role owner, not the security team reviewing their own work.", "key": ["Complete list, agreed to a system extract", "Understandable to the reviewer", "Evidence of real review, not rubber-stamping", "Timely sign-off", "Removals traced to SAP", "Right reviewer, independent of security admin"]}, "33": {"title": "Sampling approach", "question": "“How do you decide the sample size for a control test, and how do you select the sample?”", "answer": "Sample size comes from the firm's or client's methodology, mainly based on how often the control runs and how risky it is. A common table is: annual 1, quarterly 2, monthly 2 to 5, weekly 5 to 15, daily 20 to 40, and many times a day 25 to 60, with higher numbers for higher risk or where we plan to rely more. Automated controls are different: if the ITGCs are effective, I test one instance of each relevant scenario plus confirm the configuration did not change during the period. For selection, I use random or systematic selection from a complete population and record the method and seed, so a reviewer can reproduce it. I make sure the sample covers the whole period, not just the first months. If I find an exception, I do not quietly add more samples; I discuss with my lead whether to expand the sample or conclude the control is ineffective, following the methodology.", "key": ["Methodology drives sample size by frequency and risk", "Typical frequency table", "Automated: one per scenario plus configuration unchanged", "Random or systematic, reproducible selection", "Covers the whole period", "Exception handling agreed with the lead"]}, "34": {"title": "Completeness and accuracy of system reports", "question": "“A control owner gives you an SAP report as evidence. How do you know you can rely on it?”", "answer": "I treat it as information produced by the entity, and I need evidence that it is complete and accurate before I use it. First, how was it produced: standard SAP transaction, custom report or query, or a spreadsheet built from an extract. Second, the parameters: I want to see them, ideally by observing the run or re-running it myself, so I know nothing was filtered out. Third, completeness: I agree the total count or value to an independent source, such as the general ledger balance or a second report. Fourth, accuracy: I trace a few items from the report back to the source documents in SAP and from source to report. For a custom report, I also need comfort over the logic, either by testing it or by relying on effective change management for that program. If the report was exported to Excel, I check that nothing was changed after export. All of this goes in the workpaper, because reviewers and external auditors look for it first.", "key": ["Identifies it as IPE", "Source and type of report (standard, custom, spreadsheet)", "Parameters observed or re-run", "Completeness agreed to independent total", "Accuracy traced both ways", "Custom logic tested or covered by change control"]}, "35": {"title": "Testing an automated control", "question": "“How would you test the three-way match tolerance control in SAP S/4HANA?”", "answer": "I start with design: I inspect the tolerance configuration for invoice verification, the tolerance keys for price and quantity variances by company code, and agree them to the policy the business has approved. Then I test operation with both a positive and a negative case. Where possible I observe, in a test system with the same configuration, an invoice within tolerance being posted and one outside tolerance being blocked for payment. In production I can instead take existing invoices blocked for price or quantity variance and confirm the block reason matches the tolerance. I also check who can release blocked invoices, because a strong block is pointless if anyone can release it, and I test a sample of releases for approval. Finally, for the period, I review the configuration change logs to confirm the tolerances did not change, and I rely on effective change management ITGCs. If the tolerances changed mid-year, I test the control under both settings.", "key": ["Inspect tolerance configuration and agree to policy", "Positive and negative test", "Use existing blocked invoices in production", "Who can release blocked invoices, and approval of releases", "Configuration change logs for the period", "Reliance on change management ITGCs"]}, "36": {"title": "Proving configuration did not change", "question": "“How do you prove that an SAP configuration setting did not change during the audit period?”", "answer": "I use two sources. First, the table change logs: in SAP, configuration tables can be logged, and SCU3 shows changes to logged tables with who, when, and old and new values. Before relying on it, I confirm that table logging is switched on through the system parameter for client logging, and that the specific tables I care about are flagged for logging. Second, the transport history: configuration normally reaches production through customizing transports, so I search the import history for transports touching those tables or that configuration activity. If both show no changes, and change management ITGCs are effective, I can conclude the setting was stable. If logging was off, I cannot rely on the log, so I would compare the setting at the start and end of the period, test change management more heavily, and raise the missing logging with my lead as a finding in its own right.", "key": ["Table change logs via SCU3", "Confirm logging is switched on (client parameter and table flags)", "Transport history for customizing", "Rely on change management ITGCs", "If logging is off: start and end comparison and a finding"]}, "37": {"title": "Posting period control", "question": "“Explain the posting period control in SAP and the risks you would look for when testing it.”", "answer": "Posting period control stops users from posting into accounting periods that are closed, which protects cut-off and means reported results cannot be changed after the close. In SAP it is configured in OB52 by posting period variant, account type and account range, and it can allow a special authorization group to keep a period open for specific users, such as the close team. When I test it I look at four risks. Periods left open longer than the close calendar allows. Too many users in the authorization group that can post to open special periods. Broad access to maintain OB52 itself, because whoever can change it can reopen any period. And reopening without approval. So I inspect the settings, compare them with the close calendar, review who has access to the maintenance transaction and the authorization group, and test a sample of period openings and closings, using the change logs, against approved requests.", "key": ["Prevents posting to closed periods; protects cut-off", "OB52 by variant, account type and range", "Authorization group for special users", "Who can maintain OB52", "Reopening approved and logged"]}, "38": {"title": "Duplicate invoice check", "question": "“The client relies on SAP's duplicate invoice check. How would you assess whether it is effective?”", "answer": "SAP's duplicate invoice check compares new invoices against existing ones on a set of fields, typically vendor, company code, reference number, invoice date and amount. It only works if three things are true: the check is switched on for the vendors, through the vendor master flag; the system message is set to an error that blocks posting, rather than a warning users can click past; and the fields compared make sense. Its weakness is that a small change to the reference, such as an extra dash, defeats it. So I test design by inspecting the configuration and message settings and the vendor master flag for a sample of vendors. Then I test effectiveness with data analysis: I extract the year's invoices and look for likely duplicates using fuzzy matching on reference, the same amount and vendor within a short window. Any real duplicates paid show that the control, or a compensating review, is not working, and I take them to the payables team.", "key": ["Fields compared by the check", "Vendor master flag switched on", "Message set to error, not warning", "Weakness: small changes to the reference defeat it", "Data analysis for likely duplicates", "Follow up duplicates paid"]}, "39": {"title": "COBIT versus COSO", "question": "“How is COBIT different from COSO, and when would you use it?”", "answer": "COSO is a general framework for internal control, used by most companies to assess internal control over financial reporting under SOX. COBIT, from ISACA, is a framework for the governance and management of enterprise IT. It covers far more than financial reporting, including IT strategy, risk, security, service delivery and performance measurement. In SOX work, COSO is the framework management reports against, and COBIT is often used underneath it to organise and describe the IT general controls, for example mapping access, change and operations controls to COBIT processes, or using its maturity approach in advisory work. I would use COBIT when a client wants to improve IT governance more broadly, or when designing an ITGC framework from scratch, while keeping the SOX conclusion tied to COSO and the financial reporting risks.", "key": ["COSO: internal control framework for ICFR", "COBIT: IT governance and management (ISACA)", "COBIT covers more than financial reporting", "COBIT used to structure ITGCs under COSO", "Advisory and governance uses"]}, "40": {"title": "Fiori security and access", "question": "“How does Fiori access work, and how would you check that a user cannot do more in Fiori than their role allows?”", "answer": "Fiori access has layers. The launchpad shows tiles based on business catalogs and, in newer releases, spaces and pages assigned through roles. Showing a tile is not the real control. To run an app, the user needs authorization to start its OData service, and then the backend authorizations decide what they can actually read or change, using the same authorization objects as the GUI transactions behind the app. So a user might not see a tile but still call the service directly if they have the authorization. To check access, I look at the backend roles and the service authorizations, not just the catalogs. For SoD, I make sure the GRC ruleset includes Fiori apps and their OData services and the related transaction codes, otherwise risk analysis will under-report conflicts. And I test a sample of users by checking their effective authorizations, ideally in a test system with the same roles.", "key": ["Launchpad: catalogs, spaces and pages", "Tile visibility is not the control", "OData service authorization", "Backend authorization objects control data", "GRC ruleset must include Fiori apps and services", "Test effective authorizations"]}, "41": {"title": "Data migration controls", "question": "“What controls would you expect over data migration into S/4HANA, and how would you test them?”", "answer": "Migration is where errors enter the new system for good, so I expect controls on completeness, accuracy and validity. Before migration, the data is cleansed and the mapping from old fields to new is designed and approved. During each load, record counts and control totals are compared between the extract and what was loaded, and errors are corrected and reloaded. After the load, the key reconciliations are done: general ledger balances by account and company code, open payables and receivables, asset values and inventory, from the old system to S/4HANA, with differences explained. Master data, such as vendor bank details, is sample-checked field by field. Finally, the business owners sign off before go-live. To test, I reperform a sample of the reconciliations, check that sign-offs were given before go-live, and look at access during the migration window, because migration users often have powerful access that must be removed afterwards.", "key": ["Data cleansing and approved mapping", "Record counts and control totals per load", "Balance reconciliations old to new", "Master data sample checks", "Business sign-off before go-live", "Powerful migration access removed afterwards"]}, "42": {"title": "Database-level privileged access", "question": "“Why does privileged access to the HANA database matter for SOX, and how would you test it?”", "answer": "Someone with powerful access to the HANA database can read or change tables directly, without going through SAP's application controls, authorizations or change documents. That can undermine every control above it. So I test four things. Who has database accounts, and whether each is justified and approved, taking the user list from the database itself. Who holds powerful system privileges, such as user administration or the ability to change data in the SAP schema, and whether the default SYSTEM user is deactivated or tightly controlled. Whether audit policies are switched on for privileged activity, such as changes to users and privileges and direct data changes. And whether someone independent reviews those audit logs. If the client is on RISE, much of the database administration is done by SAP, so I check the SOC 1 for those controls and focus my own testing on any database access the client keeps.", "key": ["Direct table access bypasses application controls", "Database user list and approval", "Powerful system privileges and the SYSTEM user", "Audit policies switched on", "Independent review of logs", "RISE: rely on SOC 1 for SAP's part"]}, "43": {"title": "Complementary user entity controls", "question": "“What are complementary user entity controls, and what do you do with them?”", "answer": "Complementary user entity controls are the things the service provider says its clients must do for the provider's control objectives to be achieved. They are listed in the SOC 1 report. The service auditor's opinion assumes the client performs them, so if the client does not, the clean opinion does not protect the client. What I do is take the list and map each one to a control in the client's risk and control matrix. Typical examples are that the client manages user access to the application, approves changes before asking the provider to import them, and reviews the provider's notifications. Where a matching control exists, I test it as part of normal testing. Where none exists, I propose a new control with an owner and frequency and agree it with the process owner. Any CUEC that is not performed is the client's deficiency, not the provider's, and I report it that way.", "key": ["Definition: client responsibilities listed in the SOC 1", "Opinion assumes the client performs them", "Map each to a client control", "Test mapped controls", "Create new controls for gaps, with owners", "Unperformed CUEC is the client's deficiency"]}, "44": {"title": "Exceptions in a SOC 1 report", "question": "“The SOC 1 opinion is clean, but Section IV lists three exceptions. What do you do with them?”", "answer": "A clean opinion means the service auditor concluded the control objectives were still met overall, but each exception can still matter to my client, so I assess each one. I record what failed, the sample size and number of failures, and the provider's response. Then I ask whether my client's environment was in the failed sample or could be affected; if the report does not say, I ask the provider in writing. I look for compensating controls, both at the provider, such as another control in the same objective that worked, and at the client, such as a monitoring control that would catch the same problem. Then I conclude with one of three outcomes: no impact, with the reason; impact mitigated by a named compensating control, which I then test; or impact not mitigated, which I raise as a deficiency to evaluate. Writing 'no impact' next to every exception is one of the most common findings against SOC 1 reviews.", "key": ["Clean opinion does not mean no client impact", "Record each exception and the provider's response", "Was the client affected? Ask in writing if unclear", "Compensating controls at provider and client", "Three-outcome conclusion", "Avoid blanket 'no impact'"]}, "45": {"title": "Bridge letters and coverage gaps", "question": "“The provider's SOC 1 ends on 30 June and your client's year ends on 31 December. How do you cover the gap?”", "answer": "That is a six-month gap, which is long. I would first request a bridge letter from the provider covering 1 July to 31 December. A bridge letter is a statement from the provider's management that the controls have not changed materially and that they know of no failures since the report period. It is not audited, so on its own it is weak for a gap this long. I would therefore discuss with the external auditor what else is needed, and lean on the client's own controls over the provider for those six months: for example the monthly reconciliation of the provider's output to the ledger, reviews of service reports and incidents, and the client's review of changes. I would test those controls for the gap period. I would also check when the provider's next report is due, in case it arrives in time, and read the bridge letter carefully for mentions of changes, such as a new data centre.", "key": ["Six months is a long gap", "Bridge letter: management's statement, not audited", "Agree extra procedures with the external auditor", "Test client monitoring controls over the gap", "Check the next report date", "Read the bridge letter for changes"]}, "46": {"title": "Carve-out versus inclusive method", "question": "“What is the difference between the carve-out and inclusive methods in a SOC 1 report, and why does it matter to you?”", "answer": "Service organizations often rely on other providers, called subservice organizations, such as a co-location data centre. Under the inclusive method, the subservice organization's relevant controls are included in the description and tested within the same SOC 1 report. Under the carve-out method, they are excluded: the report describes what the subservice organization does and lists the controls the provider expects it to have, called complementary subservice organization controls, but does not test them. It matters because, under carve-out, part of the control chain my client relies on has not been examined in that report. So I identify every carved-out provider, decide whether its controls matter to my client's financial reporting, and if they do, obtain evidence about them, usually the subservice organization's own SOC 1, or check that the provider monitors it effectively. I record this in the reliance memo.", "key": ["Subservice organizations explained", "Inclusive: tested within the report", "Carve-out: excluded, CSOCs listed", "Carved-out controls not tested", "Obtain the subservice organization's report if relevant", "Record in the reliance memo"]}, "47": {"title": "Using AI on client data safely", "question": "“A colleague pasted a client's full user list, with names, into a public AI chatbot to analyse it. What is the problem and what do you do?”", "answer": "That is a confidentiality and data protection problem. The client's data, including personal data, has gone to a service the firm and client have not approved, and we cannot be sure how it is stored or used. I would ask my colleague to stop and not paste anything more, and I would raise it with our lead straight away, without blaming, because the firm will have an incident process and may need to inform the client or its data protection officer. I would not try to quietly fix it myself. Then I would help redo the analysis the right way: using the AI tool the firm has approved for client work, masking names with codes and keeping the key separately, and saving the prompt and output with the workpaper. Afterwards, I would suggest a short reminder to the team on the AI rules, because these mistakes usually come from people trying to save time, not from bad intent.", "key": ["Identifies confidentiality and data protection breach", "Stop further sharing", "Escalate to the lead; firm incident process", "Do not hide or fix quietly", "Redo with approved tool and masked data", "Team reminder; no blame"]}, "48": {"title": "Checking AI-drafted test steps", "question": "“An AI tool drafted test steps for a quarterly user access review control. What would you check before using them?”", "answer": "I would check it against a short list. Is there a step to prove the user list given to reviewers was complete, by comparing it with a system extract at the same date? AI drafts often miss this. Does the sample size follow our methodology for a quarterly control, usually two quarters, rather than an inflated number? Are the SAP sources right, for example user and role data from SUIM or the GRC reports, and do they exist in this system? Does it test that requested removals were actually processed, by tracing them to change documents? Is the reviewer independent of the security team? And could another tester re-perform the steps from what is written? I would correct the draft, mark it as reviewed by me, and keep the original output and my changes with the workpaper.", "key": ["Population completeness step", "Sample size per methodology", "Correct and existing SAP sources", "Removals traced to SAP", "Reviewer independence", "Re-performable; keep original and corrections"]}, "49": {"title": "Role design and SoD remediation", "question": "“A client has hundreds of SoD conflicts. How would you lead a remediation programme?”", "answer": "I would not start by working user by user. First I make sure the numbers are real: confirm the ruleset is right for the client and run permission-level analysis to remove false positives. Then I analyse at role level, because most user conflicts come from a few badly designed roles; fixing one role can clear dozens of conflicts. Next I use usage data to remove access people have not used, which is quick and low-risk. What is left needs business decisions: redesign or split roles, reassign duties, or accept the risk with a tested mitigating control, signed off by the business owner. I prioritize by risk, starting with the critical financial risks like vendor payments and journal posting. To keep it clean, I make sure risk analysis runs before access is approved in access requests, and that new roles are checked in Business Role Management before they go live. I report progress weekly with a simple measure: open critical conflicts by owner.", "key": ["Validate ruleset and remove false positives first", "Fix at role level", "Remove unused access using usage data", "Business decisions: redesign, reassign or mitigate", "Prioritize critical financial risks", "Preventive checks in access requests and role design", "Weekly progress reporting"]}, "50": {"title": "The top-down, risk-based approach", "question": "“What does a top-down, risk-based approach to SOX scoping mean, and how does it decide which SAP systems and controls you test?”", "answer": "Top-down, risk-based means starting from the financial statements, not from the system. First I identify significant accounts and disclosures, using materiality and qualitative risk. Then the relevant assertions for each, such as existence or completeness, and the processes and transactions that feed them. Then the risks of material misstatement in those processes, and the key controls that address them, choosing the most efficient mix of manual and automated controls. Only then do I look at technology: which systems support those key controls or produce the reports they rely on. Those systems, such as the SAP production client for finance and logistics, and the database and operating system beneath it, are in scope for ITGCs. This approach is what PCAOB AS 2201 expects of the external auditor, and following it means we test what matters and can defend why other areas are out of scope. I document each step so the scope can be challenged and explained.", "key": ["Start from financial statements and significant accounts", "Relevant assertions and processes", "Risks of material misstatement and key controls", "Systems in scope because key controls depend on them", "Aligned with PCAOB AS 2201", "Documented and defensible scope"]}, "51": {"title": "Classifying deficiencies", "question": "“How do you decide whether a control failure is a deficiency, a significant deficiency or a material weakness?”", "answer": "A deficiency exists when a control's design or operation does not allow staff to prevent or detect misstatements on a timely basis. To decide severity I look at two questions: how likely is it that the failure could lead to a misstatement, and how big could that misstatement be. A material weakness is a deficiency, or combination, where there is a reasonable possibility that a material misstatement will not be prevented or detected on time. A significant deficiency is less severe than that but important enough to merit the attention of those overseeing financial reporting, such as the audit committee. In practice I document the facts, the accounts and amounts exposed, any compensating controls that operated and at what precision, and whether several deficiencies in the same area
