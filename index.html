const IMX='Thornfield_Invoice_Match_Extract.xlsx',CPX='Thornfield_Config_and_Period_Extract.xlsx',DIX='Thornfield_Duplicate_Invoice_Extract.xlsx',PIX='Thornfield_Payroll_Interface_Extract.xlsx',FAX='Thornfield_Fiori_Access_Extract.xlsx',MGX='Thornfield_Migration_and_DB_Access_Extract.xlsx';
const W3T='Week 3: Application controls, S/4HANA and the project lifecycle (Q10, Q11, Q15, Q16, Q35, Q36, Q37, Q38, Q40, Q41, Q42)';
const W3U=[
{id:'3.1',wk:W3T,title:'Application controls and testing an automated control (Q10 and Q35)',time:'about 3.5 hours',
 learn:[
  {h:'What an application control is (Q10)',p:'A control built into the system that <b>runs automatically every time</b>, so it does not depend on a person remembering. Two SAP examples: the <b>three-way match</b> (invoice, purchase order, goods receipt) with price and quantity tolerances, and <b>posting period control</b> (OB52). A manual control can fail any day, so you test a sample across the year. An automated control behaves the same way every time.'},
  {h:'Testing it (Q35)',p:'<b>Design</b>: inspect the tolerance configuration (OMR6) and agree it to the approved policy. <b>Operation</b>: a positive and a negative test. In production, take existing blocked invoices and confirm the block reason matches the tolerance. <b>Who can release</b> blocked invoices (MRBR) and is each release approved? For the period, review the <b>configuration change logs</b> and rely on effective <b>change management ITGCs</b>.'},
  {h:'The condition',p:'Test once per scenario <b>only if</b> the ITGCs over change and access are effective. If they are weak, the configuration could have changed and one test proves nothing about the rest of the year.'}],
 why:'Q10 and Q35 check whether you understand why automated controls are tested differently, and what that depends on.',
 sim:[
  {s:SCR.easy,say:'Check the configuration. Type OMR6 and press Enter.',a:{k:'cmd',v:'OMR6'}},
  {s:SCR.omr6,say:'These are the tolerance limits: price 5% and quantity 3%. You would agree them to the approved policy. Now see who releases blocked invoices. Type /nMRBR.',a:{k:'cmd',v:'MRBR'}},
  {s:SCR.mrbrI,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.mrbrR,say:'Note the Released by and Approval ref columns. Two releases by the same clerk have no approval. Click Next.',a:{k:'read'}}],
 files:[IMX],
 lab:{intro:'Open <b>'+IMX+'</b>. <b>TOLERANCES</b> shows the policy (price 5%, quantity 3%). <b>INVOICES</b> has 40 invoices. Calculate price variance % = (INV_PRICE - PO_PRICE) / PO_PRICE and quantity variance % = (INV_QTY - GR_QTY) / GR_QTY. An invoice is <b>outside tolerance</b> if either exceeds its limit.',tasks:[
  {q:'How many invoices are in the extract?',t:'num',a:ANS.im_total,why:'Population count.'},
  {q:'How many invoices are outside tolerance?',t:'num',a:ANS.im_out,why:'Add two helper columns for variance % and filter.'},
  {q:'Of those, how many show a block reason (they were blocked by the system)?',t:'num',a:ANS.im_blocked,why:'The control worked for these.'},
  {q:'How many outside-tolerance invoices were posted with NO block?',t:'num',a:ANS.im_posted_out,why:'The control did not stop them. This is unusual for an automated control and points to a configuration change.'},
  {q:'How many released invoices have no approval reference?',t:'num',a:ANS.im_rel_noappr,why:'A block is only as good as the control over its release.'},
  {q:'Which user released them? Enter the user name.',t:'txt',a:[ANS.im_rel_user.toLowerCase()],why:'AP_CLERK1 released two blocked invoices without approval. Segregation of duties and approval both fail here.'},
  {q:'How many instances would you normally test for an automated control with effective ITGCs?',t:'mcq',o:['25 to 60','One per scenario, plus confirm the configuration did not change','None'],a:1,why:'Automated controls behave consistently, but only if the configuration did not change.'},
  {q:'All the unblocked outside-tolerance invoices are dated after 10 June 2026. What would you check next?',t:'mcq',o:['The invoice dates only','Whether the tolerance configuration changed in the period (change log)','The vendor names'],a:1,why:'That is the next unit: a change log can show the tolerance was widened.'}]},
 tb:[{n:10},{n:35}],
 quiz:[
  {q:'What is a key feature of an automated application control?',o:['It runs every time without relying on a person','It is reviewed monthly','It is verbal'],a:0,e:'Consistency is the point.'},
  {q:'Which transaction shows invoice tolerance limits?',o:['OMR6','SU01','SM37'],a:0,e:'OMR6 shows tolerance keys such as price and quantity variance.'},
  {q:'Why test who can release blocked invoices?',o:['A strong block is pointless if anyone can release it','It is optional','Releases are always fine'],a:0,e:'Test the release control too.'},
  {q:'Testing once is only valid if...',o:['ITGCs over change and access are effective','The invoice is large','The vendor is known'],a:0,e:'Otherwise the configuration could have changed.'}]},

{id:'3.2',wk:W3T,title:'Proving configuration did not change, and posting period control (Q36 and Q37)',time:'about 3.5 hours',
 learn:[
  {h:'Proving a setting did not change (Q36)',p:'Two sources. <b>Table change logs (SCU3)</b>: for tables that have logging switched on, SCU3 shows who, when, old and new value. First confirm that <b>logging is on</b> (system parameter) and the <b>table is flagged</b>. Second, the <b>transport history</b>: customizing reaches production by transport, so search the import history. If both are clean and change ITGCs work, the setting was stable. If logging was off, compare the setting at start and end, test change management harder, and raise the missing logging as a finding.'},
  {h:'Posting period control (Q37)',p:'Stops posting to closed periods, protecting cut-off. Configured in <b>OB52</b> by variant, account type and range, with an <b>authorization group</b> that lets some users post to open special periods. Risks: periods open <b>past the close calendar</b>; <b>too many users</b> in the authorization group; <b>broad access to maintain OB52</b> itself; <b>reopening without approval</b>.'}],
 why:'Both questions are really about evidence: how do you know the control was the same all year, and who could have changed it?',
 sim:[
  {s:SCR.easy,say:'Type OB52 and press Enter.',a:{k:'cmd',v:'OB52'}},
  {s:SCR.ob52,say:'Periods 7 and 8 are still open on 31 October. Click the red row.',a:{k:'click',id:'rP7'}},
  {s:SCR.ob52d,say:'Open for the FI_CLOSE group. Now check the history of the tolerance table. Type /nSCU3.',a:{k:'cmd',v:'SCU3'}},
  {s:SCR.scu3i,say:'Type the table T169G (the invoice tolerance table).',a:{k:'type',id:'fTab',v:'T169G'}},
  {s:SCR.scu3i,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.scu3r,say:'The tolerance was widened from 5 to 15 percent by FIN_CONFIG on 10 June. This explains the unblocked invoices from the previous unit. Click Next.',a:{k:'read'}}],
 files:[CPX],
 lab:{intro:'Open <b>'+CPX+'</b>. Sheets: <b>CLOSE_CALENDAR</b> (when each period must be closed), <b>OB52_STATUS_AT_2026-10-31</b>, <b>SCU3_LOG</b>, <b>AUTH_GROUP_FI_CLOSE</b>, <b>OB52_MAINTAIN_ACCESS</b>. Review date <b>2026-10-31</b>.',tasks:[
  {q:'How many periods are Open on 31 October although the close calendar says they should already be closed?',t:'num',a:ANS.pc_open_late,why:'Periods 7 and 8 (July and August). Period 10 is the current period and is allowed to be open.'},
  {q:'How many entries are in the SCU3 log?',t:'num',a:ANS.pc_log_total,why:'Nine logged changes in the period.'},
  {q:'How many of those are changes to the posting period table T001B?',t:'num',a:ANS.pc_t001b,why:'Filter TABLE on T001B.'},
  {q:'How many logged changes have no ticket?',t:'num',a:ANS.pc_noticket,why:'The tolerance change and one reopened period. No approval trail.'},
  {q:'What is the new price tolerance percentage after the change to T169G?',t:'num',a:15,why:'5.0 became 15.0.'},
  {q:'How many users are in the FI_CLOSE authorization group, and how many are NOT in the close team? Enter the number NOT in the close team.',t:'num',a:ANS.pc_auth_notteam,why:'Four of nine can post to special open periods without being part of the close team.'},
  {q:'How many users who are NOT in Basis or Finance Systems can maintain OB52 (change posting periods)?',t:'num',a:ANS.pc_ob52_nonfin,why:'Two Accounts Payable users can reopen any period.'},
  {q:'SCU3 shows no change to a setting. Is that enough to conclude it did not change?',t:'mcq',o:['Yes','Only if logging was switched on for that table; also check the transport history','Yes if the client agrees'],a:1,why:'Missing log entries mean nothing if logging was off.'}]},
 tb:[{n:36},{n:37}],
 quiz:[
  {q:'Which transaction shows table change logs?',o:['SCU3','SU01','OB52'],a:0,e:'SCU3 shows changes to logged tables.'},
  {q:'Before relying on SCU3 you confirm...',o:['Logging is switched on for the table','The user list','The report title'],a:0,e:'No logging means no log.'},
  {q:'Who can reopen any period?',o:['Whoever can maintain OB52','Everyone','Nobody'],a:0,e:'Restrict access to OB52 maintenance.'},
  {q:'What does posting period control protect?',o:['Cut-off and the integrity of reported results','Password strength','Network speed'],a:0,e:'Closed periods cannot be changed after the close.'}]},

{id:'3.3',wk:W3T,title:'The duplicate invoice check (Q38)',time:'about 2.5 hours',
 learn:[
  {h:'How the check works',p:'SAP compares a new invoice with existing ones on fields such as <b>vendor, company code, reference, invoice date and amount</b>. It only works when: the <b>vendor master flag</b> "check double invoice" is on; the system message is an <b>error</b> that blocks posting, not a <b>warning</b> users can click past; and the compared fields make sense.'},
  {h:'Its weakness',p:'A small change to the reference defeats it: an extra dash, a space, a different case. So you do not stop at the configuration. You run <b>data analysis</b> on the whole year: normalise the reference (remove dashes and spaces, ignore case) and look for the same vendor and amount within a short window.'},
  {h:'Follow up',p:'Any duplicate that was <b>paid</b> shows the control or a compensating review failed. Quantify it and escalate.'}],
 why:'Q38 shows whether you can combine configuration review with data analytics, which is what separates a senior from a junior tester.',
 sim:[
  {s:SCR.easy,say:'Type FK03 and press Enter.',a:{k:'cmd',v:'FK03'}},
  {s:SCR.fk03i,say:'Type vendor 100612.',a:{k:'type',id:'fVend',v:'100612'}},
  {s:SCR.fk03i,say:'Click Display.',a:{k:'click',id:'bDisp'}},
  {s:()=>SCR.vend2('gen'),say:'Click the Payment transactions tab.',a:{k:'click',id:'tPay'}},
  {s:()=>SCR.vend2('pay'),say:'The "Check double invoice" flag is off for this vendor, so SAP will never compare its invoices. Click Next.',a:{k:'read'}}],
 files:[DIX],
 lab:{intro:'Open <b>'+DIX+'</b>. <b>INVOICES</b> has 150 invoices. <b>VENDOR_FLAGS</b> shows whether the double-invoice check is on. To find near-duplicates, add a helper column that normalises REFERENCE: =UPPER(SUBSTITUTE(SUBSTITUTE(C2,"-","")," ","")). Then look for the same vendor, normalised reference and amount.',tasks:[
  {q:'How many vendors have the double-invoice check switched OFF?',t:'num',a:ANS.di_flagoff,why:'Filter CHECK_DOUBLE_INVOICE_FLAG = N.'},
  {q:'How many pairs are EXACT duplicates (same vendor, reference and amount)?',t:'num',a:ANS.di_exact,why:'These are the ones SAP should catch if the flag is on and the message is an error.'},
  {q:'How many duplicate pairs are there after normalising the reference?',t:'num',a:ANS.di_pairs,why:'The normalised analysis finds the near-duplicates the system check misses.'},
  {q:'How many of the pairs are near-duplicates only (not exact)?',t:'num',a:ANS.di_near,why:'They differ by a dash, a space or case.'},
  {q:'How many duplicate pairs had the second invoice PAID?',t:'num',a:ANS.di_paid,why:'PAID = Y on the second invoice means money went out.'},
  {q:'What is the total amount of the duplicate payments?',t:'num',a:ANS.di_paid_amt,why:'Sum the amount of each paid second invoice. This is the quantified exposure to report.'},
  {q:'How many duplicate pairs involve a vendor with the flag OFF?',t:'num',a:ANS.di_pair_flagoff,why:'A direct link from a configuration gap to an actual duplicate.'},
  {q:'The duplicate message is set as a Warning (see the MESSAGE_SETTING sheet). What do you recommend?',t:'mcq',o:['Leave it, users are careful','Change it to an Error so posting is blocked, and review how many warnings were overridden','Switch the check off'],a:1,why:'A warning can be clicked past. An error stops the posting.'}]},
 tb:[{n:38}],
 quiz:[
  {q:'Which vendor setting drives the duplicate check?',o:['The check double invoice flag','The country','The payment terms'],a:0,e:'If it is off, the system does not compare.'},
  {q:'Error versus warning message: which is stronger?',o:['Error: it blocks posting','Warning: it blocks posting','No difference'],a:0,e:'Users can click through a warning.'},
  {q:'Why can an extra dash defeat the check?',o:['The reference no longer matches exactly','The amount changes','The vendor changes'],a:0,e:'The comparison is on the reference as typed.'},
  {q:'What do you do if you find duplicates that were paid?',o:['Quantify and escalate','Ignore','Delete them'],a:0,e:'It shows the control failed.'}]},

{id:'3.4',wk:W3T,title:'Interface controls and reading a design document (Q11 and Q16)',time:'about 3.5 hours',
 learn:[
  {h:'Interface controls (Q11)',p:'Expect controls in four places. <b>At the source</b>: payroll results are approved before sending. <b>In transit</b>: control totals (record count, total amount) sent with the file and checked on receipt. <b>On receipt</b>: errors logged and monitored (IDoc monitor, WE02), every error corrected and reprocessed. <b>Afterwards</b>: a finance <b>reconciliation</b> between the payroll register and what posted, signed and reviewed. Also test <b>who can change the mapping or job</b>, and consider the provider\'s <b>SOC 1</b>.'},
  {h:'Reading a functional design document (Q16)',p:'Read it with the control in mind. Purpose and precision. <b>Data sources</b> complete? <b>Selection parameters</b> that could exclude data. <b>Logic</b> clear and testable. <b>Authorization checks</b>. A <b>test plan</b> that proves completeness and accuracy, including reconciliation to a standard report. Feed gaps back <b>before build</b>.'}],
 why:'Interface failures are quiet. This unit shows how an error sitting unprocessed produces a gap that only the reconciliation can catch.',
 sim:[
  {s:SCR.easy,say:'Type WE02 to open the IDoc list.',a:{k:'cmd',v:'WE02'}},
  {s:SCR.we02i,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.we02r,say:'Status 53 means posted. Status 51 means an error. Click the red IDoc in error.',a:{k:'click',id:'rIdoc'}},
  {s:SCR.we02d,say:'The error was never reprocessed. Click Next.',a:{k:'read'}}],
 files:[PIX],
 lab:{intro:'Open <b>'+PIX+'</b>. <b>PAYROLL_REGISTER</b> is what the payroll provider sent. <b>SAP_POSTING</b> is what posted in SAP, with the finance reconciliation sign-off. <b>IDOC_ERRORS</b> lists interface errors. A reconciliation should be signed within <b>5 days</b> of posting.',tasks:[
  {q:'How many payroll runs are in the register?',t:'num',a:ANS.pi_runs,why:'Population.'},
  {q:'In how many runs does the posted total differ from the register total?',t:'num',a:ANS.pi_total_mis,why:'Compare TOTAL_GROSS with POSTED_TOTAL per RUN_ID.'},
  {q:'In how many runs does the posted count differ from the employee count?',t:'num',a:ANS.pi_count_mis,why:'Run 5 posted 3 fewer.'},
  {q:'What is the total difference (register minus posted) across all runs?',t:'num',a:ANS.pi_diff_total,why:'This is under-posted payroll cost in the ledger.'},
  {q:'How many error IDocs were never reprocessed (REPROCESSED_DATE blank)?',t:'num',a:ANS.pi_unrep,why:'These explain the two mismatched runs.'},
  {q:'How many runs have NO finance reconciliation sign-off?',t:'num',a:ANS.pi_nosign,why:'The control that should have caught the gap did not operate for these runs.'},
  {q:'How many reconciliations were signed more than 5 days after posting?',t:'num',a:ANS.pi_late,why:'Late sign-offs.'},
  {q:'How many changes to the interface have no ticket?',t:'num',a:ANS.pi_chg_noticket,why:'A mapping change by FIN_CONFIG with no ticket: a change and access issue on the interface.'},
  {q:'FDD REVIEW: the design says the report uses table BSID (customer items) only, but it is meant to cover vendor and customer open items. What is the issue?',t:'mcq',o:['Data sources incomplete: vendor items (BSIK) are missing','It is fine','Only the layout'],a:0,why:'A report built on incomplete sources will always be incomplete.'},
  {q:'FDD REVIEW: the selection screen defaults company code to 1000 and lets the user change it. What do you flag?',t:'mcq',o:['Nothing','A parameter that can exclude data without anyone noticing; require all relevant codes or show the selection on the output','The font'],a:1,why:'The previous unit showed a report that left out company code 1300.'},
  {q:'FDD REVIEW: there is no test plan for completeness and accuracy. What do you ask for?',t:'mcq',o:['Nothing, test later','Test cases that prove completeness and accuracy, including reconciliation to a standard report, before build','A bigger screen'],a:1,why:'Feed gaps back before build, when fixing is cheapest.'}]},
 tb:[{n:11},{n:16}],
 quiz:[
  {q:'IDoc status 53 means...',o:['Application document posted','Error','Deleted'],a:0,e:'51 is an error, 53 is posted.'},
  {q:'Which control catches under-posting from an interface?',o:['Reconciliation of source to ledger','A password policy','A backup'],a:0,e:'It compares what was sent with what posted.'},
  {q:'Control totals are...',o:['Record count and amount checked on receipt','A budget','A role'],a:0,e:'They prove the file arrived complete.'},
  {q:'When do you feed back design gaps?',o:['Before build','After go-live','Never'],a:0,e:'Fixing a design is cheaper than failing an audit.'}]},

{id:'3.5',wk:W3T,title:'What S/4HANA changes, and Fiori access (Q15 and Q40)',time:'about 3 hours',
 learn:[
  {h:'What changes (Q15)',p:'The <b>Universal Journal</b> puts finance and controlling postings in one table, so reports and reconciliations built on old tables must be rebuilt and re-tested. Users work in <b>Fiori apps</b>, so access risk now involves catalogs, <b>OData services</b> and backend roles, and the SoD ruleset must include Fiori. <b>Business partner</b> replaces separate vendor and customer masters. <b>RISE with SAP</b> shifts Basis and infrastructure controls to SAP and brings <b>SOC 1</b> reliance. The <b>migration</b> itself is a risk. The opportunity: more embedded analytics and automation.'},
  {h:'How Fiori access works (Q40)',p:'The launchpad shows tiles from <b>business catalogs</b>, spaces and pages. <b>Showing a tile is not the control.</b> To run an app the user needs authorization for its <b>OData service</b>, and then the <b>backend authorizations</b> decide what they can read or change. A user with no tile can still call a service directly if authorized. Check backend roles and service authorizations, make sure the <b>GRC ruleset includes Fiori apps and services</b>, and test effective authorizations.'}],
 why:'Q15 and Q40 test whether you have kept up with S/4HANA. Candidates who only talk about SAP GUI sound out of date.',
 sim:[
  {s:SCR.fioriLP,say:'JWEBER sees two tiles. Click Next to look at the role behind them.',a:{k:'read'}},
  {s:SCR.easy,say:'Type PFCG to open role maintenance.',a:{k:'cmd',v:'PFCG'}},
  {s:SCR.pfcgI,say:'Type the role Z_FIORI_AP_CLERK.',a:{k:'type',id:'fRole',v:'Z_FIORI_AP_CLERK'}},
  {s:SCR.pfcgI,say:'Click Display.',a:{k:'click',id:'bDisp'}},
  {s:()=>SCR.pfcgD('menu'),say:'The menu shows only one tile. Click the Authorizations tab.',a:{k:'click',id:'tAuth'}},
  {s:()=>SCR.pfcgD('auth'),say:'The role also authorizes the Manage Business Partner service and change access to vendor data. There is no tile, but the service can still be called. Click Next.',a:{k:'read'}}],
 files:[FAX],
 lab:{intro:'Open <b>'+FAX+'</b>. <b>SERVICES</b> lists eight Fiori services and whether the GRC ruleset covers them. <b>ROLE_SERVICES</b> shows, per role, whether the tile is visible and whether the OData service is authorized. <b>USER_ROLES</b> assigns roles to users.',tasks:[
  {q:'How many services are listed?',t:'num',a:ANS.fi_services,why:'Eight services.'},
  {q:'How many role-service rows have the service authorized (Y) but NO tile visible (N)?',t:'num',a:ANS.fi_hidden,why:'These users can call the service without ever seeing a tile.'},
  {q:'How many services are NOT in the GRC ruleset?',t:'num',a:ANS.fi_notruleset,why:'Including vendor maintenance and invoice approval. GRC will under-report conflicts.'},
  {q:'Which user holds a hidden vendor-maintenance service AND the payments service? Enter the user name.',t:'txt',a:[ANS.fi_user.toLowerCase()],why:'JWEBER has Z_FIORI_AP_CLERK (hidden S01) and Z_FIORI_TREASURY (S02 payments): a vendor-and-payment conflict.'},
  {q:'Will GRC risk analysis report that conflict?',t:'mcq',o:['Yes, always','No, the vendor maintenance service S01 is not in the ruleset, so it is invisible to the analysis','Only on Tuesdays'],a:1,why:'The ruleset must include Fiori apps and services.'},
  {q:'Which is the real control over a Fiori app?',t:'mcq',o:['The tile being visible','The OData service authorization and backend authorizations','The launchpad colour'],a:1,why:'A hidden tile is not a control.'},
  {q:'The Universal Journal puts finance and controlling postings in...',t:'mcq',o:['One table','Ten tables','Excel'],a:0,why:'Reports and reconciliations built on the old tables must be rebuilt and re-tested.'}]},
 tb:[{n:15},{n:40}],
 quiz:[
  {q:'Does a hidden tile stop a user using the app?',o:['No, the service may still be authorized','Yes, always','Only on mobile'],a:0,e:'Service authorization decides.'},
  {q:'What must the GRC ruleset include after S/4HANA?',o:['Fiori apps and OData services','Nothing new','Only GUI transactions'],a:0,e:'Otherwise risk analysis under-reports.'},
  {q:'Business partner replaces...',o:['Separate vendor and customer master transactions','The ledger','Fiori'],a:0,e:'Master data controls move.'},
  {q:'What does RISE with SAP bring into scope?',o:['SOC 1 reliance on SAP','Nothing','Paper checks'],a:0,e:'Some controls are now operated by SAP.'}]},

{id:'3.6',wk:W3T,title:'Data migration and database-level access (Q41 and Q42)',time:'about 3 hours',
 learn:[
  {h:'Migration controls (Q41)',p:'Migration is where errors enter the new system for good. Expect: <b>cleansing and an approved mapping</b>; <b>record counts and control totals</b> for every load, with errors fixed and reloaded; <b>balance reconciliations</b> from old to new (GL by account and company code, open payables and receivables, assets, inventory), differences explained; <b>sample checks</b> of master data; <b>business sign-off before go-live</b>; and powerful <b>migration access removed afterwards</b>.'},
  {h:'Database access (Q42)',p:'Powerful access to the HANA database lets someone read or change tables <b>without going through SAP</b>: no authorizations, no change documents. Test: who has database accounts and whether each is approved (take the list from the database); who holds <b>powerful privileges</b>, and whether the default <b>SYSTEM user is deactivated</b>; whether <b>audit policies</b> are switched on for privileged activity; and whether someone <b>independent reviews the logs</b>. On RISE, much of this is SAP\'s, so rely on the <b>SOC 1</b> and test any access you control.'}],
 why:'These are the two "back door" questions of an S/4HANA project: wrong data going in, and powerful access going around the controls.',
 sim:[
  {s:SCR.easy,say:'Type ZMIG_BALANCE_RECON to run the project\'s reconciliation report.',a:{k:'cmd',v:'ZMIG_BALANCE_RECON'}},
  {s:SCR.migR,say:'Three accounts differ. One has no explanation in the project file. Click Next, then look at the database.',a:{k:'read'}},
  {s:SCR.hanaHome,say:'Open User Management.',a:{k:'click',id:'tUsers'}},
  {s:SCR.hanaUsers,say:'SYSTEM is active and unapproved. The migration user was still used long after go-live. Click Next.',a:{k:'read'}},
  {s:SCR.hanaHome,say:'Now open Audit Policies.',a:{k:'click',id:'tAudit'}},
  {s:SCR.hanaAudit,say:'Two policies that matter most are switched off. Click Next.',a:{k:'read'}}],
 files:[MGX],
 lab:{intro:'Open <b>'+MGX+'</b>. Sheets: <b>LOAD_COUNTS</b> (migration loads), <b>BALANCE_RECON</b> (legacy against S/4HANA), <b>HANA_DB_USERS</b>, <b>HANA_AUDIT_POLICIES</b>, <b>PROJECT_DATES</b> (go-live 2026-07-01, review 2026-10-31). FINAL_COUNT = first load + reloaded.',tasks:[
  {q:'How many data objects were migrated?',t:'num',a:ANS.mg_objects,why:'Seven objects.'},
  {q:'For how many objects does FINAL_COUNT differ from EXTRACT_COUNT?',t:'num',a:ANS.mg_short,why:'One object is incomplete after reload.'},
  {q:'Which object is incomplete? Enter its name.',t:'txt',a:['open ap items','open ap item'],why:'Open AP items: some items never made it to S/4HANA.'},
  {q:'How many records are missing?',t:'num',a:ANS.mg_short_n,why:'1,842 extracted, 1,839 final. Missing payables mean unpaid invoices may be forgotten.'},
  {q:'How many accounts show a non-zero difference in the balance reconciliation?',t:'num',a:ANS.mg_diff,why:'Three accounts differ.'},
  {q:'What is the amount of the UNEXPLAINED difference?',t:'num',a:ANS.mg_unexpl_amt,why:'Account 210000: no explanation. Do not accept sign-off without one.'},
  {q:'How many database users are not approved (APPROVED = N)?',t:'num',a:ANS.db_unappr,why:'SYSTEM and DBA_TEMP.'},
  {q:'How many database users hold DATA ADMIN?',t:'num',a:ANS.db_dataadmin,why:'DATA ADMIN can change data directly.'},
  {q:'Which migration user was still logging on after go-live? Enter the user name.',t:'txt',a:[ANS.db_mig.toLowerCase()],why:'MIG_USER1 last logged on 2026-10-02, three months after go-live. Migration access should be removed afterwards.'},
  {q:'How many audit policies are switched off?',t:'num',a:ANS.db_pol_off,why:'Including direct data changes in the SAP schema: the one that would show tampering behind SAP.'}]},
 tb:[{n:41},{n:42}],
 quiz:[

{id:'4.1',wk:W4T,title:'Reading a SOC 1 report: type, CUECs and exceptions (Q17, Q43, Q44)',time:'about 4 hours',
 learn:[
  {h:'Type I and Type II (Q17)',p:'A SOC 1 reports on a service provider\'s controls that matter to its clients\' <b>financial reporting</b>. <b>Type I</b>: design at <b>one date</b>. <b>Type II</b>: design <b>and operation over a period</b> (six to twelve months) with the auditor\'s tests listed. For SOX reliance you need a <b>Type II</b> covering most of the year. Type I is a stop-gap at most. A <b>SOC 2</b> is about security criteria and is <b>not</b> a substitute.'},
  {h:'CUECs (Q43)',p:'Complementary user entity controls are the client\'s own duties listed in the report. The opinion <b>assumes you do them</b>. Map each to a client control, test it, and create a control with an owner for any gap. A CUEC nobody performs is the <b>client\'s</b> deficiency.'},
  {h:'Exceptions (Q44)',p:'A clean opinion can still list exceptions. For each: what failed (sample and failures), the provider\'s response, <b>was my client in the failed sample</b> (ask in writing if unclear), compensating controls at the provider and at the client. Conclude: <b>no impact</b> (with reason), <b>mitigated</b> by a named control you then test, or <b>not mitigated</b>: raise a deficiency.'}],
 why:'Reading a SOC report properly is the heart of third-party reliance. Most people stop at "clean opinion".',
 sim:[
  {s:()=>SCR.socView('op'),say:'This is the opinion page. Check type and period. Click the CUEC tab.',a:{k:'click',id:'tCuec'}},
  {s:()=>SCR.socView('cuec'),say:'Two CUECs have no client control. Click Section IV.',a:{k:'click',id:'tExc'}},

{id:'4.3',wk:W4T,title:'Bridge letters, coverage gaps and carve-outs (Q45, Q46)',time:'about 3 hours',
 learn:[
  {h:'The coverage gap (Q45)',p:'If the SOC 1 ends 30 June and your year ends 31 December, you have <b>six months</b> uncovered. Get a <b>bridge letter</b> (management\'s statement: no material changes, no known failures). It is <b>not audited</b>, so it is weak alone. Agree extra procedures with the external auditor and <b>test the client\'s monitoring controls</b> over the gap (reconciliations, service reviews, change reviews). Check when the next report is due.'},
  {h:'Carve-out versus inclusive (Q46)',p:'Subservice organizations (for example a data centre). <b>Inclusive</b>: their controls are in the report and tested. <b>Carve-out</b>: excluded, only listed as complementary subservice organization controls. Under carve-out, part of the chain is <b>untested</b>. Decide if it matters, and if so get that provider\'s own report. Record it in the reliance memo.'}],
 why:'These two are the follow-up questions interviewers use once you say "I read the SOC 1".',

  {s:()=>SCR.bridge('br'),say:'A 184 day gap with only a bridge letter. Click the Subservice organizations tab.',a:{k:'click',id:'tSub'}},

{id:'4.4',wk:W4T,title:'Using AI safely in control testing (Q19, Q47, Q48)',time:'about 3.5 hours',
 learn:[
  {h:'Where AI helps and where it does not (Q19)',p:'Use AI for <b>volume and pattern work</b>: triaging SoD conflicts (mitigated, unused, active), matching transports to tickets, drafting steps. <b>AI output is not evidence</b>; the system report is. Tell it to <b>use only the data supplied</b> and list what it cannot decide. <b>Severity</b> stays human. Verify a sample in SAP. Keep the prompt and output.'},
  {h:'Client data (Q47)',p:'Pasting a client user list into a public chatbot is a <b>confidentiality and data protection breach</b>. Stop, tell the lead at once, do not fix it quietly, then redo with the <b>approved tool and masked data</b>. Remind the team, without blame.'},
  {h:'Checking AI-drafted steps (Q48)',p:'Check: <b>population completeness</b> step; <b>sample size</b> per methodology (quarterly: usually two quarters); <b>real SAP sources</b>; <b>removals traced</b> to change documents; <b>reviewer independence</b>; <b>re-performable</b>. Mark as reviewed and keep original and corrections.'}],
 why:'AI questions are now standard. The best answers are specific about what gets checked.',
 sim:[
  {s:()=>SCR.aiChat('raw'),say:'The prompt has real names and emails. Click Mask names and emails.',a:{k:'click',id:'bMask'}},
  {s:()=>SCR.aiChat('masked'),say:'Now only codes and a rule to use only supplied data. Click Send.',a:{k:'click',id:'bSend'}},
  {s:()=>SCR.aiChat('out'),say:'The output invents a table and a count. Never accept it unchecked. Click Next.',a:{k:'read'}}],

{id:'4.5',wk:W4T,title:'Continuous controls monitoring (Q20)',time:'about 2.5 hours',
 learn:[
  {h:'What it is',p:'Automated rules check transactions, configuration or access <b>frequently</b> (often daily) and send exceptions to an <b>owner who must close them</b>. SAP options: <b>Process Control</b>, GRC alerts, analytics on extracted data. Examples: vendor bank change followed by a payment within days; new SoD conflicts or firefighter use; duplicate invoices; changes to tolerances or posting periods.'},
  {h:'When it counts as a control',p:'The <b>rule is designed and tested</b>, the <b>data is complete</b>, and <b>every exception is worked and evidenced</b>. A tool that raises alerts nobody closes is not a control.'}],
 why:'This question tests whether you understand that the tool is not the control: the worked exception is.',
 sim:[
  {s:SCR.ccmList,say:'Click the Closed alert.',a:{k:'click',id:'rClosed'}},

 files:[CCX],

  {q:'How many rule hits have NO alert in the log?',t:'num',a:ANS.cc_notalerted,why:'Data or rule gap in the tool. Test completeness.'},
  {q:'How many alerts are still Open more than 30 days?',t:'num',a:ANS.cc_open_old,why:'Alerts nobody is working.'},

  {q:'STAR stands for...',o:['Situation, Task, Action, Result','Start, Test, Audit, Report','Scope, Time, Approach, Review'],a:0,e:'Use your own example.'},
  {q:'When is the lead brought in?',o:['Early','Last','Never'],a:0,e:'Escalate properly.'}]},

{id:'5.4',wk:W5T,title:'Mock interview: the core questions',time:'about 4 hours',
 learn:[
  {h:'How to run the mock',p:'Treat the next step as a real interview. For each question: read it, <b>answer out loud first</b> in about two minutes, then type the key points you said, then reveal the model answer and tick what you covered. Be strict. Record yourself if you can.'},
  {h:'What the interviewer scores',p:'<b>Structure</b> (a clear start, middle and end), <b>specifics</b> (a real SAP example or number), <b>honesty</b> about limits, and <b>judgement</b>. Technical depth matters, but rambling loses points faster than a missing detail.'}],
 why:'Knowing the answer and giving it under pressure are different skills. This unit trains the second.',
 sim:[],files:[],
 lab:{intro:'Quick self-check before you start.',tasks:[
  {q:'How long should each answer take?',t:'mcq',o:['About 2 minutes','As long as it takes','30 seconds'],a:0,why:'Two minutes is the discipline.'},
  {q:'You do not know part of a question. Best response?',t:'mcq',o:['Bluff','Say what you know, state the limit, and say how you would find out','Stay silent'],a:1,why:'Honesty with a plan.'}]},
 tb:[{n:3},{n:10},{n:18},{n:25}],
 quiz:[
  {q:'Answer aloud first, then...',o:['Write the key points and compare to the model','Skip the model','Only read'],a:0,e:'Compare honestly.'},
  {q:'A good answer has...',o:['Structure and a specific example','Jargon','Length'],a:0,e:'Specifics.'},
  {q:'If you forget a point...',o:['Carry on calmly','Stop','Restart'],a:0,e:'Interviewers watch composure.'},
  {q:'After each mock you...',o:['Note gaps and revisit that unit','Move on','Quit'],a:0,e:'Close the loop.'}]},

{id:'5.5',wk:W5T,title:'Capstone: the Thornfield briefing',time:'about 4 hours',
 learn:[
  {h:'The brief',p:'You have spent four weeks finding problems at Thornfield. Now present them. Pull together four exposures you found: <b>paid duplicate invoices</b>, <b>under-posted payroll</b>, an <b>unexplained migration difference</b> and <b>payments after unapproved bank changes</b>. A senior consultant ties findings into one story and one ask.'},
  {h:'The pattern',p:'Several findings have a <b>common root</b>: weak change and configuration control (the widened tolerance, the switched-off duplicate flag) and weak monitoring (unreconciled interface, unworked alerts). Name the root, not just the symptoms.'}],
 why:'The capstone is the interview in one task: analyse, quantify, summarise for an executive, and ask for a decision.',
 sim:[],files:[],
 lab:{intro:'Use the amounts you found in Weeks 3 and 4.',tasks:[
  {q:'Duplicate invoice payments (Unit 3.3). Enter the amount.',t:'num',a:ANS.di_paid_amt,why:'Paid second invoices.'},
  {q:'Payroll under-posted (Unit 3.4). Enter the amount.',t:'num',a:ANS.pi_diff_total,why:'Register minus posted.'},
  {q:'Unexplained migration difference (Unit 3.6). Enter the amount.',t:'num',a:ANS.mg_unexpl_amt,why:'Account 210000.'},
  {q:'Payments after bank detail changes (Unit 4.5). Enter the amount.',t:'num',a:ANS.cc_hits_amt,why:'Rule hits.'},
  {q:'Add the four amounts. What is the total exposure?',t:'num',a:CAPSUM,why:'The single number for the executive. Say it first.'},
  {q:'What is the best one-line root cause?',t:'mcq',o:['Weak control over configuration changes and weak monitoring of exceptions','Bad luck','Users are careless'],a:0,why:'Fix the system, not the people.'},
  {q:'What is the best ask of the CFO?',t:'mcq',o:['Nothing','Approve a change-control and monitoring remediation plan with named owners and dates','More data'],a:1,why:'A decision and owners.'}]},
 tb:[{title:'Capstone: brief the CFO',prompt:'You have 5 minutes with the Thornfield CFO. Summarise what you found across Weeks 3 and 4, give the total exposure, name the common root cause and make one clear ask.',model:'We found '+CAPSUM.toLocaleString('en-US',{minimumFractionDigits:2})+' of exposure in four places: paid duplicate invoices, under-posted payroll, an unexplained migration difference and payments made soon after unapproved bank detail changes. The common root is weak control over configuration changes and weak follow-up of exceptions: a tolerance was widened and a duplicate-check flag was switched off with no approval, and interface errors and monitoring alerts were not worked. We found no evidence of fraud, but we cannot rely on these controls this year. Access and settings are being corrected and recovery has started. I need your approval for a remediation plan with named owners and dates, and for a monthly review of exceptions.',pts:['Total exposure stated first','Four findings named in plain words','Common root cause named','What is being done','One clear ask with owners and dates','No jargon']}],
 quiz:[
  {q:'What leads a CFO briefing?',o:['The total exposure','Table names','Your CV'],a:0,e:'Impact first.'},
  {q:'A good root cause statement is about...',o:['Controls, not blame','Individuals','Software brands'],a:0,e:'Systems fix systems.'},
  {q:'The ask should be...',o:['Specific with owners and dates','Vague','Absent'],a:0,e:'A decision.'},
  {q:'If you found no evidence of loss, you still say...',o:['The control cannot be relied on','All is fine','Nothing'],a:0,e:'Reliance is the point.'}]}
];
W5U.forEach(u=>u.tb=u.tb.map(t=>t.n?{title:'Q'+t.n+'. '+QS[t.n].title,prompt:QS[t.n].question,model:QS[t.n].answer,pts:QS[t.n].key,n:t.n}:t));
W5U.forEach(u=>UNITS.push(u));

const SRX='Thornfield_SoD_Remediation_Extract.xlsx',SCX='Thornfield_Scoping_Extract.xlsx',DFX='Thornfield_Deficiency_Evaluation_Extract.xlsx',PJX='Thornfield_S4_Project_Controls_Extract.xlsx',ARX='Thornfield_AI_Reliance_Extract.xlsx';

const W6U=[
{id:'6.1',wk:W6T,title:'Leading an SoD remediation programme (Q49)',time:'about 3 hours',
 learn:[
  {h:'Do not go user by user',p:'First make the numbers <b>real</b>: confirm the ruleset fits the client and run <b>permission-level analysis</b> to remove false positives. Then analyse at <b>role level</b>: a few badly designed roles cause most conflicts. Use <b>usage data</b> to remove unused access (quick, low risk). For what remains, business owners decide: <b>redesign, reassign or mitigate</b>.'},
  {h:'Then keep it fixed',p:'Prioritise <b>critical financial risks</b>. Add preventive checks to access requests and role design so conflicts do not return. Report progress <b>weekly</b>.'}],
 why:'A lead is asked how to turn hundreds of conflicts into a programme with an end date.',
 sim:[
  {s:SCR.grcRoles,say:'Click the role with the most conflicts.',a:{k:'click',id:'rAP'}},
  {s:SCR.grcRoleD,say:'18 of its conflicts are unused. Click Next.',a:{k:'read'}}],
 files:[SRX],
 lab:{intro:'Open <b>'+SRX+'</b>. Each row is a role with its conflict count, false positives, conflicts where the access is unused (removable), and whether it is a critical financial risk. Unused conflicts are real conflicts, not false positives.',tasks:[
  {q:'How many conflicts in total?',t:'num',a:ANS.sr_total,why:'Sum of CONFLICTS.'},
  {q:'How many are false positives?',t:'num',a:ANS.sr_fp,why:'Remove first. Do not spend remediation effort on them.'},
  {q:'How many real conflicts remain after removing false positives?',t:'num',a:ANS.sr_real,why:'Total minus false positives.'},
  {q:'How many conflicts do the top three roles carry together?',t:'num',a:ANS.sr_top3,why:'42 + 27 + 22: fix three roles to clear most of the problem.'},
  {q:'How many real conflicts can be removed by deleting unused access?',t:'num',a:ANS.sr_unused,why:'Quick wins.'},
  {q:'How many conflicts remain after removing false positives and unused access?',t:'num',a:ANS.sr_remain,why:'This is the true size of the programme: needs business decisions.'},
  {q:'How many roles are critical financial risks?',t:'num',a:ANS.sr_crit_roles,why:'Priority one.'},
  {q:'How many conflicts remain in the critical roles after the two clean-ups?',t:'num',a:ANS.sr_crit_conf,why:'Start with these.'}]},
 tb:[{n:49}],
 quiz:[
  {q:'First step in a remediation programme?',o:['Validate the ruleset and remove false positives','Remove all access','Start with users'],a:0,e:'Make the numbers real.'},
  {q:'Most conflicts come from...',o:['A few badly designed roles','Every user equally','The network'],a:0,e:'Role level.'},
  {q:'Unused access is...',o:['Quick and low risk to remove','Never removable','Always mitigated'],a:0,e:'Use usage data.'},
  {q:'Who decides redesign, reassign or mitigate?',o:['Business owners','Testers alone','The vendor'],a:0,e:'Business decisions.'}]},

{id:'6.2',wk:W6T,title:'Top-down, risk-based scoping (Q50)',time:'about 2.5 hours',
 learn:[
  {h:'Start from the financial statements',p:'Identify <b>significant accounts</b> using materiality and qualitative risk, then <b>relevant assertions</b>, the <b>processes</b> that feed them, the <b>risks of material misstatement</b>, and the <b>key controls</b>. A system is in scope <b>because key controls depend on it</b>, not because it exists. This follows PCAOB AS 2201 and must be documented and defensible.'}],
 why:'Scoping decides the whole engagement: too wide wastes money, too narrow misses a material weakness.',
 sim:[],files:[SCX],
 lab:{intro:'Open <b>'+SCX+'</b>. <b>ACCOUNTS</b> shows balances and the system holding each. <b>PARAMETERS</b> gives materiality (5,000,000) and the threshold for a significant account (2,500,000).',tasks:[
  {q:'How many accounts are significant (balance at or above the threshold)?',t:'num',a:ANS.sc_sig,why:'Filter BALANCE >= 2,500,000.'},
  {q:'What is the total balance of the significant accounts?',t:'num',a:ANS.sc_sig_amt,why:'Their coverage of the statements.'},
  {q:'How many systems host at least one significant account?',t:'num',a:ANS.sc_sys_scope,why:'SAP ERP and PayrollCo. These are in scope.'},
  {q:'Which account-holding system is OUT of scope? Enter its name.',t:'txt',a:['expensepro'],why:'Its only account, travel expense (1.8M), is below the threshold.'},
  {q:'How many distinct business processes feed the significant accounts?',t:'num',a:ANS.sc_proc,why:'Scope the processes, then the controls in them.'},
  {q:'SAP BW has no ledger postings. Is it in scope?',t:'mcq',o:['No, never','Only if a key control depends on its reports (report reliance)','Always'],a:1,why:'Scope follows the key controls, so check report reliance.'},
  {q:'PayrollCo is outsourced. How do you cover it?',t:'mcq',o:['Ignore it','Rely on its SOC 1 Type II and test client controls','Audit its building'],a:1,why:'Link back to Week 4.'}]},
 tb:[{n:50}],
 quiz:[
  {q:'Top-down starts from...',o:['The financial statements','The systems list','Last year\'s file'],a:0,e:'Not from the system.'},
  {q:'A system is in scope because...',o:['Key controls depend on it','It exists','It is big'],a:0,e:'Dependency.'},
  {q:'Which standard is it aligned with?',o:['PCAOB AS 2201','ISO 9001','HIPAA'],a:0,e:'Top-down risk-based.'},
  {q:'The scope must be...',o:['Documented and defensible','Verbal','Secret'],a:0,e:'The auditor will challenge it.'}]},

{id:'6.3',wk:W6T,title:'Classifying deficiencies (Q51)',time:'about 3 hours',
 learn:[
  {h:'Two questions',p:'How <b>likely</b> is a misstatement, and how <b>big</b> could it be? A <b>material weakness</b> is a deficiency or combination where there is a reasonable possibility a material misstatement will not be prevented or detected. A <b>significant deficiency</b> is less severe but merits attention. Look at <b>compensating controls</b> and their precision.'},
  {h:'Aggregate',p:'Several deficiencies in the <b>same account</b> are evaluated <b>together</b>. Two significant deficiencies can add up to a material weakness. For ITGCs, assess the impact on the dependent business controls.'}],
 why:'This is the hardest judgement a controls lead makes, and the one most worth practising with numbers.',
 sim:[],files:[DFX],
 lab:{intro:'Open <b>'+DFX+'</b>. <b>DEFICIENCIES</b> lists 8. <b>RULES</b> states the exercise rules: materiality 5,000,000, significant deficiency threshold 1,250,000. Only count a deficiency when it is reasonably possible and has no effective compensating control.',tasks:[
  {q:'Evaluated INDIVIDUALLY, how many are material weaknesses?',t:'num',a:ANS.df_mw,why:'None reaches 5,000,000 alone with the conditions met (D6 is not reasonably possible).'},
  {q:'Evaluated individually, how many are significant deficiencies?',t:'num',a:ANS.df_sd,why:'D1, D2, D5, D8.'},
  {q:'How many are plain deficiencies?',t:'num',a:ANS.df_def,why:'D3, D4, D6, D7.'},
  {q:'How many have an effective compensating control?',t:'num',a:ANS.df_comp,why:'D4: exclude it from the severity count if the compensating control is precise enough.'},
  {q:'How many are not reasonably possible?',t:'num',a:ANS.df_notposs,why:'D6: large, but unlikely.'},
  {q:'What is the aggregated potential misstatement for Revenue (D1 plus D2)?',t:'num',a:ANS.df_rev_agg,why:'3,000,000 + 2,500,000.'},
  {q:'After aggregating by account, how many accounts now reach material weakness?',t:'num',a:ANS.df_mw_agg,why:'Revenue: 5,500,000 is above materiality. Two significant deficiencies became a material weakness.'},
  {q:'Who agrees the classification?',t:'mcq',o:['You alone','Management and the external auditor, with your reasoning documented','Nobody'],a:1,why:'It must be defensible.'}]},
 tb:[{n:51}],
 quiz:[
  {q:'Severity depends on...',o:['Likelihood and magnitude','Colour','Age of the control'],a:0,e:'Two questions.'},
  {q:'Deficiencies in the same account are...',o:['Aggregated','Ignored','Deleted'],a:0,e:'Combined effect.'},
  {q:'A compensating control must be...',o:['Precise enough to catch the issue','Informal','Annual'],a:0,e:'Otherwise it does not count.'},
  {q:'Two significant deficiencies together could be...',o:['A material weakness','Fine','Cancelled'],a:0,e:'Aggregation.'}]},

{id:'6.4',wk:W6T,title:'Controls across an S/4HANA implementation (Q52)',time:'about 2.5 hours',
 learn:[
  {h:'Get involved from the start',p:'Controls are cheapest in <b>design</b>. <b>Explore</b>: agree scope with the auditor, map current controls, find those that can be automated, write <b>control requirements into design documents</b>. <b>Realize</b>: check configuration and role design (including SoD), write <b>automated control test scripts</b>. <b>Cutover</b>: migration reconciliations and removing migration access. <b>Hypercare</b>: first close with controls operating. Keep the external auditor informed throughout.'}],
 why:'Interviewers use this to check you can lead controls on a project, not just test after the fact.',
 sim:[],files:[PJX],
 lab:{intro:'Open <b>'+PJX+'</b>. <b>DELIVERABLES</b> shows the controls deliverables by project phase and their status. <b>DESIGN_DOCS</b> shows whether each design document has control requirements.',tasks:[
  {q:'How many controls deliverables are listed?',t:'num',a:ANS.pj_total,why:'Population.'},
  {q:'How many are Missing?',t:'num',a:ANS.pj_missing,why:'Not started.'},
  {q:'How many are Late?',t:'num',a:ANS.pj_late,why:'Started but behind.'},
  {q:'How many Realize-phase deliverables are not Done?',t:'num',a:ANS.pj_realize_open,why:'Role design SoD check and test scripts: both needed before UAT.'},
  {q:'How many design documents lack control requirements?',t:'num',a:ANS.pj_fdd_no,why:'Raise now. Fixing a design is cheaper than failing an audit.'},
  {q:'Which phase should hold the migration reconciliation sign-off?',t:'txt',a:['cutover'],why:'Cut-over and data migration.'}]},
 tb:[{n:52}],
 quiz:[
  {q:'When do you get involved?',o:['From the start','At go-live','After the audit'],a:0,e:'Cheapest in design.'},
  {q:'Where do control requirements go?',o:['Design documents','Nowhere','Test scripts only'],a:0,e:'Fit-to-standard and functional designs.'},
  {q:'Hypercare controls focus on...',o:['The first close','Training','Marketing'],a:0,e:'Are the controls operating?'},
  {q:'Who is kept informed?',o:['The external auditor','Nobody','Competitors'],a:0,e:'Avoid surprises.'}]},

{id:'6.5',wk:W6T,title:'AI reliance and controls over a GenAI tool (Q53, Q54)',time:'about 3.5 hours',
 learn:[
  {h:'Relying on AI-assisted work (Q53)',p:'On every AI-assisted workpaper: the <b>approved tool</b>; the <b>input</b> (original export with parameters and a completeness check); the <b>prompt and unedited output</b> saved with the date; <b>documented verification</b> including AI errors found; a <b>human conclusion, reviewed</b>; <b>data protection</b>; and the approach <b>agreed with the external auditor at planning</b>.'},
  {h:'Controls over a client\'s GenAI testing tool (Q54)',p:'Treat the tool as an <b>in-scope system</b>. Risks: wrong or invented results, incomplete inputs, silent changes, over-reliance. Controls: requirements traced to the control matrix; <b>input controls</b>; a <b>known-answer test set</b>; <b>change control</b> over prompts and models; access and logging; <b>human sign-off</b>; auditor involved early.'}],
 why:'AI questions are what separate leads who are current from those who are not.',
 sim:[],files:[ARX],
 lab:{intro:'Open <b>'+ARX+'</b>. <b>AI_WORKPAPERS</b> shows six reliance attributes for 10 workpapers. <b>GENAI_TOOL_CONTROLS</b> shows whether the client implemented each control. <b>KNOWN_ANSWER_TEST</b> compares expected and tool results for 20 cases.',tasks:[
  {q:'How many workpapers have ALL six attributes?',t:'num',a:ANS.ai_wp_clean,why:'Only these are reliable.'},
  {q:'How many workpapers have at least one gap?',t:'num',a:ANS.ai_wp_gap,why:'Fix before anyone relies on them.'},
  {q:'How many used a tool that was not approved?',t:'num',a:ANS.ai_notappr,why:'A data protection issue, as in Unit 4.4.'},
  {q:'How many have no documented verification?',t:'num',a:ANS.ai_noverif,why:'Output without verification is not evidence.'},
  {q:'How many of the 8 GenAI tool controls are NOT implemented?',t:'num',a:ANS.ai_tool_no,why:'Input checks, change control, logging, auditor informed.'},
  {q:'In the known-answer test, how many cases did the tool get wrong?',t:'num',a:ANS.ai_kat_miss,why:'Compare EXPECTED to TOOL_RESULT.'},
  {q:'What is the accuracy percentage?',t:'num',a:ANS.ai_kat_acc,why:'17 of 20 is 85 percent. Is that acceptable for a control? Not without human review of every result.'},
  {q:'Would you rely on the tool unreviewed?',t:'mcq',o:['Yes, 85 percent is good','No: require human review of conclusions and agree the approach with the auditor','Only on Fridays'],a:1,why:'Errors are silent. Human sign-off stays.'}]},
 tb:[{n:53},{n:54}],
 quiz:[
  {q:'What is kept with an AI-assisted workpaper?',o:['Prompt, output, inputs and verification','Only the conclusion','Nothing'],a:0,e:'So it can be re-performed.'},
  {q:'A known-answer test set does what?',o:['Measures the tool against cases with correct answers','Speeds the tool up','Replaces the lead'],a:0,e:'Accuracy check.'},
  {q:'Prompt or model changes need...',o:['Change control','Nothing','Applause'],a:0,e:'Silent changes are a risk.'},
  {q:'When do you agree the AI approach with the external auditor?',o:['At planning','At year end','Never'],a:0,e:'Before reliance.'}]}
];

W6U.forEach(u=>UNITS.push(u));

const TKX='Thornfield_Engagement_Tracker_Extract.xlsx',RCX='Thornfield_RCM_Review_Extract.xlsx',WSX='Thornfield_Weekly_Status_Extract.xlsx',WRX='Thornfield_Workpaper_Review_Extract.xlsx',RMX='Thornfield_Remediation_Plan_Extract.xlsx',SGX='Thornfield_Engagement_Scoping_Extract.xlsx';
const W7T='Week 7 (Lead track): Leading the engagement (Q55 to Q60)';
const W7U=[
{id:'7.1',wk:W7T,title:'Your first two weeks as controls lead (Q55)',time:'about 3 hours',
 learn:[
  {h:'Take control, find the fires',p:'Meet the <b>sponsor and the external auditor first</b>. Read the scope, risk and control matrix and tracker, then <b>check the tracker against reality</b>: trackers on late engagements are optimistic. Start a <b>RAID log</b> (risks, assumptions, issues, dependencies) and pick the critical issues.'},
  {h:'Then re-baseline',p:'<b>Re-baseline the plan</b> with owners, agreed with the sponsor. Set a <b>weekly rhythm</b>: stand-up, status, auditor meeting. Deliver an <b>early win</b>. Avoid big changes before you understand the causes.'}],
 why:'Interviewers want to see that you diagnose before you reorganise.',
 sim:[],files:[TKX],
 lab:{intro:'Open <b>'+TKX+'</b>. <b>TRACKER</b> has 14 controls with reported status and whether evidence is on file. Review date is <b>14 Oct 2026</b>. <b>RAID</b> is the current log.',tasks:[
  {q:'How many controls does the tracker show as Complete?',t:'num',a:ANS.tk_complete,why:'What the team reports.'},
  {q:'How many of those have NO evidence on file?',t:'num',a:ANS.tk_noev,why:'Complete without evidence is not complete.'},
  {q:'What is the true completion percentage (Complete with evidence, out of all controls)?',t:'num',a:ANS.tk_true,why:'5 of 14. The tracker was optimistic.'},
  {q:'How many controls not reported Complete are already past their due date?',t:'num',a:ANS.tk_overdue,why:'Due before 14 Oct.'},
  {q:'How many controls are Not started?',t:'num',a:ANS.tk_notstarted,why:'Plan these first.'},
  {q:'How many RAID items are High severity?',t:'num',a:ANS.rd_high,why:'Your critical list.'},
  {q:'How many RAID items are Issues (already happening)?',t:'num',a:ANS.rd_issue,why:'Issues come before risks.'},
  {q:'Who do you meet first?',t:'mcq',o:['The testers','The sponsor and the external auditor','Nobody'],a:1,why:'Learn expectations and worries first.'}]},
 tb:[{n:55}],
 quiz:[
  {q:'Trackers on late engagements are usually...',o:['Optimistic','Accurate','Empty'],a:0,e:'Check against reality.'},
  {q:'RAID stands for...',o:['Risks, assumptions, issues, dependencies','Review, audit, inspect, deliver','Red, amber, ignore, done'],a:0,e:'Your working log.'},
  {q:'Before big changes you...',o:['Understand the causes','Reorganise the team','Replace the auditor'],a:0,e:'Diagnose first.'},
  {q:'An early win shows...',o:['Momentum and credibility','Nothing','Luck'],a:0,e:'Pick something achievable.'}]},

{id:'7.2',wk:W7T,title:'Building and owning the control matrix (Q56)',time:'about 3 hours',
 learn:[
  {h:'Build top-down',p:'Significant accounts and assertions, then <b>risks of material misstatement</b>, then <b>key controls</b>, then the <b>ITGCs</b> over the systems those controls depend on. Each row needs a unique <b>ID</b>, a description <b>precise enough to test</b>, the risk, <b>owner, frequency, type, nature</b>, whether it is key, and the ITGC link.'},
  {h:'Keep it right',p:'<b>Walk through</b> each control with its owner, <b>agree it with the external auditor</b>, and keep <b>change control and version history</b>. Tell testers and the auditor when it changes.'}],
 why:'The matrix is the lead\'s core document. Everything the team tests comes from it.',
 sim:[],files:[RCX],
 lab:{intro:'Open <b>'+RCX+'</b>. It is a draft matrix of 12 controls. Review it as the lead.',tasks:[
  {q:'How many control rows are in the matrix?',t:'num',a:ANS.rcm_rows,why:'Population.'},
  {q:'How many rows have NO owner?',t:'num',a:ANS.rcm_noowner,why:'A control without an owner cannot be performed or tested.'},
  {q:'How many rows have no frequency?',t:'num',a:ANS.rcm_nofreq,why:'You cannot size a sample without it.'},
  {q:'How many control IDs appear more than once (extra rows)?',t:'num',a:ANS.rcm_dup,why:'AP-02 is used twice.'},
  {q:'How many descriptions are too vague to test ("as needed", "as appropriate")?',t:'num',a:ANS.rcm_vague,why:'A description must be precise enough to test.'},
  {q:'How many KEY controls have no ITGC link?',t:'num',a:ANS.rcm_keynoitgc,why:'A key control that depends on a system needs ITGCs.'},
  {q:'How many controls have not been agreed with the external auditor?',t:'num',a:ANS.rcm_notagreed,why:'Agree before testing.'}]},
 tb:[{n:56}],
 quiz:[
  {q:'The matrix is built...',o:['Top-down','Bottom-up from the system','At random'],a:0,e:'Accounts to controls.'},
  {q:'A good description is...',o:['Precise enough to test','Short','Vague'],a:0,e:'Testers must know what to check.'},
  {q:'Changes to the matrix need...',o:['Change control and version history','Nothing','A new matrix'],a:0,e:'Auditable.'},
  {q:'Who must agree it?',o:['The external auditor','The caterer','Nobody'],a:0,e:'Avoid rework.'}]},

{id:'7.3',wk:W7T,title:'Weekly reporting and the measures that matter (Q57)',time:'about 2.5 hours',
 learn:[
  {h:'One page, every week, same format',p:'Overall <b>RAG with one sentence of reason</b>. <b>Testing progress</b> against plan, by area. <b>Overdue evidence by owner</b> (the best early warning). <b>Open exceptions</b> and possible severe deficiencies. <b>Top risks and decisions needed</b>. <b>No surprises</b>.'}],
