combine to something worse. An ITGC failure is assessed by its effect on the application controls and reports that depend on it. I bring a proposed rating with reasoning to my lead; final classification is agreed with management and the external auditor.", "key": ["Definition of a deficiency", "Likelihood and magnitude", "Material weakness and significant deficiency definitions", "Compensating controls and precision", "Aggregation of deficiencies", "ITGC impact via dependent controls", "Agreed with management and auditor"]}, "52": {"title": "Controls across an implementation", "question": "“You join an S/4HANA implementation as the controls lead. Where in the project lifecycle do you get involved, and what do you deliver at each stage?”", "answer": "I get involved from the start, because controls are cheapest to build in during design. In the prepare and explore phases, I agree the controls scope with the business and the external auditor, map current controls and identify which can become automated in S/4HANA, and write control requirements into the fit-to-standard and functional design documents. In realize, I check that the configuration delivers those controls, that the role design is free of SoD conflicts, and I write test scripts for the automated controls so they are tested as part of integration and user acceptance testing. In deploy, I own the cut-over controls: data migration reconciliations, approval of the migration, and access set up before go-live. After go-live, in hypercare, I check the first period close and confirm the new controls are operating, so the first SOX cycle has evidence from day one. Throughout, I keep the external auditor informed so they can plan reliance.", "key": ["Involved from the start", "Control requirements in design documents", "Configuration and role design checked in realize", "Automated control test scripts in integration and UAT", "Cut-over and data migration controls", "Hypercare: first close and controls operating", "Keep the external auditor informed"]}, "53": {"title": "Relying on AI-assisted work", "question": "“As a lead, what would you need to see before you or the external auditor could rely on testing your team did with AI?”", "answer": "I would want six things documented on every AI-assisted workpaper. The tool used and confirmation it is approved for client data. The inputs: the original system export with its parameters and a completeness check, because the AI's output is only as good as its input. The exact prompt and the unedited output, saved with the date. The verification: which items the preparer checked in the system and what they found, including any errors the AI made. A conclusion written and signed by the preparer and reviewed by me, never phrased as 'per AI'. And how personal data was handled. I would agree with the external auditor at planning where we intend to use AI and how we will document it, so there are no surprises at year end. When I review, I check those six items first, before I look at the conclusion.", "key": ["Approved tool", "Input completeness and accuracy", "Prompt and output retained", "Documented verification including AI errors", "Human conclusion, reviewed", "Data protection", "Agreed with external auditor at planning"]}, "54": {"title": "Controls over a GenAI controls tool", "question": "“Your client is building a GenAI tool to automate parts of SOX testing. What risks and controls would you raise as the controls lead?”", "answer": "I would treat the tool as an in-scope system, because its output will support SOX conclusions. The main risks are wrong or invented results, incomplete inputs, unnoticed changes to prompts or models, and people over-relying on it. So I would ask for: requirements traced to the risk and control matrix, so it is clear which control steps it performs; input controls proving the data it receives is complete and accurate; a test set with known answers, re-run whenever the prompt, model or configuration changes; change management over prompts and model versions, just like code; access controls over who can change it; logging of every run, including inputs and outputs; and mandatory human review and sign-off of its conclusions. I would also involve the external auditor early, because if they cannot rely on the tool, the savings disappear. A lead's job here is to translate the control matrix into clear functional requirements the developers can build and test against.", "key": ["Treat the AI tool as an in-scope system", "Risks: wrong results, incomplete inputs, silent changes, over-reliance", "Requirements traced to the control matrix", "Input controls and known-answer test set", "Change control over prompts and models", "Access, logging and human sign-off", "External auditor involved early"]}, "55": {"title": "Your first two weeks as controls lead", "question": "“You start as controls lead on an SAP SOX engagement that is already behind. What do you do in your first two weeks?”", "answer": "In week one I take control and find the fires. I meet my sponsor and the external auditor to understand what they expect and what worries them. I read the scope, the risk and control matrix and the testing tracker, and I check them against reality with the team, because trackers on late engagements are usually optimistic. I start a RAID log of risks, assumptions, issues and dependencies, and I pick the two or three issues that could stop the engagement, typically missing evidence, unavailable control owners or unclear scope, and act on them. In week two I re-baseline the plan with realistic dates and owners, agree it with the sponsor, and set a weekly rhythm: a team stand-up, a status report with clear measures, and a meeting with the external auditor. I also aim for an early win, such as closing a backlog of evidence requests, to rebuild confidence. What I avoid is changing the methodology or the team in the first days before I understand why we are behind.", "key": ["Meet sponsor and external auditor first", "Check tracker against reality", "RAID log and the critical issues", "Re-baseline plan with owners, agreed with sponsor", "Weekly rhythm: stand-up, status, auditor meeting", "Early win", "Avoid big changes before understanding causes"]}, "56": {"title": "Building and owning the control matrix", "question": "“How do you build and maintain a risk and control matrix for an SAP environment, and how do you keep it right during the year?”", "answer": "I build it top-down: from significant accounts and assertions to the risks of material misstatement in each process, then the key controls that address each risk, and finally the IT general controls over the systems those controls depend on. Each control row needs clear attributes: a unique ID, a description precise enough to test, the risk it addresses, owner, frequency, type (preventive or detective), nature (manual, automated or IT-dependent manual), the system and any key reports used, and the evidence expected. I walk it through with each control owner, so they recognise their control as written, and agree it with the external auditor before testing. During the year I keep it right with change control: any change to a process, system, role or owner comes to me, is assessed for impact on the matrix, updated with a version history, and communicated to testers and the auditor. A matrix that nobody updates after March is one of the most common causes of year-end surprises.", "key": ["Top-down: accounts, assertions, risks, controls, ITGCs", "Control attributes listed", "Walkthrough with owners", "Agreed with the external auditor", "Change control and version history", "Keeps testers and auditor informed"]}, "57": {"title": "Reporting status and KPIs", "question": "“What would you report each week to the sponsor on a SOX controls engagement, and which measures matter most?”", "answer": "I keep it to one page, every week, in the same format. At the top, an overall status in red, amber or green with one sentence on why. Then a few measures. Testing progress: controls tested and concluded against the plan, by area. Evidence: requests outstanding and how many are overdue by owner, because overdue evidence is the best early warning of a late finish. Exceptions and deficiencies: how many are open, their likely severity and remediation status, with anything that could be a significant deficiency or material weakness called out by name. Then the top risks and issues from the RAID log with owners and dates, and finally the decisions or help I need from the sponsor. I base every number on the tracker so it can be checked. The rule I follow is no surprises: if something is going wrong, the sponsor hears it from me first, with a plan, not at the end of the quarter.", "key": ["One page, weekly, consistent format", "Overall RAG with reason", "Testing progress against plan", "Overdue evidence by owner", "Open exceptions and possible severe deficiencies", "Top risks and decisions needed", "No surprises"]}, "58": {"title": "Reviewing your team's work", "question": "“How do you review a junior tester's workpaper, and how do you give feedback that improves their work?”", "answer": "I review in a set order so I catch what matters first. Is the population complete and is its source documented? Does the sample follow the methodology? Does the evidence for each sample actually show the control operated, and is it dated and from the right system? Are exceptions properly evaluated? And does the conclusion match the results? Formatting comes last. I record review points in the workpaper or tracker, so they are cleared and visible to the auditor, rather than fixing things myself. For feedback, I sit with the tester for the first few workpapers, explain why each point matters, for example why an undated screenshot is not evidence, and ask them to fix it themselves. I look for patterns rather than single errors, and I give praise for good work in the same detail. Over a few weeks the review points should fall, and I use that as my measure of whether the coaching is working.", "key": ["Review order: population, sample, evidence, exceptions, conclusion", "Review points recorded and cleared", "Tester fixes their own work", "Explain why each point matters", "Look for patterns; give specific praise", "Measure improvement over time"]}, "59": {"title": "Driving remediation to closure", "question": "“Several control deficiencies are open three months before year end. How do you get them fixed and ready for retesting in time?”", "answer": "I work back from year end. A remediated control usually has to operate for a minimum period before it can be retested, for example one or two cycles for a monthly control, so I calculate the latest date each fix must be in place. Then I prioritise by severity: anything that could be a significant deficiency or material weakness first. For each deficiency I agree with the owner a clear root cause, the fix, what 'done' looks like, a date, and the evidence that will prove it. I track them on one remediation tracker and review it weekly with the owners and monthly with the sponsor. Where an owner misses a date, I escalate quickly and early, using the escalation ladder: first a direct conversation, then their manager, then the sponsor. I also plan retesting with the external auditor so they know when to expect results. Where a fix cannot be in place in time, I tell the sponsor early so the impact on the year-end assessment can be managed honestly.", "key": ["Work back from year end and minimum operating periods", "Prioritise by severity", "Root cause, fix, definition of done, date, evidence", "One tracker, weekly and monthly reviews", "Escalate early using a ladder", "Plan retesting with the auditor", "Tell the sponsor early if a fix will be late"]}, "60": {"title": "Scoping a new SAP controls engagement", "question": "“A client asks you to scope and plan SOX IT controls work for a new SAP landscape. What questions do you ask and what do you produce?”", "answer": "I ask questions in four areas. Business and audit: which entities and accounts are significant, what the external auditor plans to rely on, and what deficiencies were found last year. Systems: the SAP landscape, which systems and clients feed financial reporting, the database and operating system, interfaces, and any planned changes such as an S/4HANA move. Third parties: hosting, RISE, payroll or other providers, and whether SOC 1 reports exist. And people: who owns each process and IT area, and who will provide evidence. I request the system landscape diagram, the previous year's control matrix and findings, user and role listings, and the change and incident processes. From that I produce a scoping memo explaining what is in and out of scope and why, an updated risk and control matrix, a test plan with timing and sample sizes, a resource plan, and an evidence request list. I agree all of it with the client and the external auditor before testing starts.", "key": ["Business and audit questions: accounts, auditor reliance, prior findings", "System landscape and planned changes", "Third parties and SOC 1 reports", "Owners and evidence providers", "Documents requested", "Outputs: scoping memo, RCM, test plan, resources, request list", "Agreed with client and auditor"]}}};

{id:'0.1',wk:'Week 0: SAP orientation (no interview questions yet)',title:'Where SAP lives: systems, clients and production',time:'about 2 hours',
 learn:[
  {h:'What SAP is',p:'SAP is the software a company uses to run finance, purchasing, sales, manufacturing and HR in one place. When a clerk posts an invoice, the entry lands in SAP tables. Those tables are what the financial statements are built from, so the people who control SAP control the numbers.'},
  {h:'Systems and clients',p:'Companies do not make changes straight in the live system. They run three systems: <b>DEV</b> (build changes), <b>QAS</b> (test them) and <b>PRD</b> (production, the live one). Inside each system, a <b>client</b> is a separate business area of data, identified by a 3-digit number. At Thornfield the clients are DEV 100, QAS 200 and PRD 300.'},
  {h:'Why auditors focus on production',p:'Production holds the real postings, so controls are tested there. A change moves from DEV to QAS to PRD through a <b>transport</b>. Production is normally locked so nobody can change configuration directly. You check this in transaction <b>SCC4</b>.'}],
 why:'Almost every interview answer starts by saying where in the landscape a control operates. If you mix up DEV and PRD, the panel will notice at once.',
 sim:[
  {s:SCR.logon,say:'Log on to the Thornfield production system. Notice the client number, then click Log On.',a:{k:'click',id:'logon'}},
  {s:SCR.easy,say:'This is the SAP Easy Access screen. Type SCC4 in the command field at the top, then press Enter.',a:{k:'cmd',v:'SCC4'}},
  {s:SCR.scc4,say:'This is the list of clients in this system. Click the row for client 300, the production client.',a:{k:'click',id:'cl300'}},
  {s:SCR.scc4d,say:'Read the settings. Production says "No changes allowed". That is the evidence an auditor screenshots to show production is locked. Click Next.',a:{k:'read'}}],
 files:[],
 lab:{intro:'Answer from what you saw in the simulator and the explanation above.',tasks:[
  {q:'Which client number is the Thornfield production client?',t:'num',a:300,why:'Client 300 is production (role: Production).'},
  {q:'In which system do developers build changes first?',t:'mcq',o:['DEV','QAS','PRD'],a:0,why:'DEV is where changes are built. QAS tests them. PRD is live.'},
  {q:'Why should production be locked against direct changes?',t:'mcq',o:['To make the system faster','So every change has to travel through approval and testing first','Because SAP cannot be changed after go-live'],a:1,why:'A locked production client forces changes through transports, which is where the change controls (approval, testing, segregation) sit.'}]},
 tb:[{title:'Explain it simply',prompt:'A friend with no SAP knowledge asks: "What is an SAP client, and why does an auditor care about production?" Answer in 3 to 4 sentences.',model:'SAP runs in three systems: development, quality assurance and production. A client is a separate set of business data inside a system, with a 3-digit number. Production is the live client where real transactions are posted, so it holds the data the financial statements come from. That is why auditors test controls there, and why they check production is locked so changes can only arrive through the approved transport route.',pts:['Names DEV, QAS and PRD','Explains client as a separate set of data with a number','Production holds the real financial data','Production locked, changes only by transport']}],
 quiz:[
  {q:'Which system holds the real, live financial data?',o:['DEV','QAS','PRD'],a:2,e:'PRD, production, is the live system.'},
  {q:'Which transaction code shows the client settings, including whether production is locked?',o:['SU01','SCC4','SM37'],a:1,e:'SCC4 shows the client role and the change protection settings.'},
  {q:'Where should a new configuration change be built first?',o:['In production, to save time','In DEV, then tested in QAS','In QAS only'],a:1,e:'Build in DEV, test in QAS, then transport to PRD.'},
  {q:'What does the client role "Production" with "No changes allowed" tell an auditor?',o:['Users cannot log on','Direct configuration changes in production are blocked','The system has no backups'],a:1,e:'It is evidence that changes cannot be made directly in production.'}]},

{id:'0.2',wk:'Week 0: SAP orientation (no interview questions yet)',title:'Moving around: transaction codes and the command field',time:'about 2 hours',
 learn:[
  {h:'Transaction codes',p:'Every SAP function has a short code called a <b>transaction code</b> or T-code. Instead of clicking through menus, you type the code in the <b>command field</b> at the top of the screen and press Enter. Controls testers work almost entirely this way.'},
  {h:'Three command habits',p:'<b>SU01</b> opens the transaction. <b>/nSU01</b> closes the current screen and opens SU01. <b>/oSU01</b> opens it in a new window. Always use /n when you are already inside another transaction.'},
  {h:'Your starter list',p:'<table class="t"><tr><th>T-code</th><th>What it shows</th></tr><tr><td>SU01</td><td>One user: type, validity, roles, profiles</td></tr><tr><td>SUIM</td><td>Reports on users, roles and profiles</td></tr><tr><td>PFCG</td><td>Role maintenance</td></tr><tr><td>SE16N</td><td>Display table contents</td></tr><tr><td>SCC4</td><td>Clients and change protection</td></tr><tr><td>STMS</td><td>Transport management</td></tr><tr><td>SM37</td><td>Batch job overview</td></tr><tr><td>SM20</td><td>Security audit log</td></tr></table>'}],
 why:'Interviewers listen for transaction codes. They show you have done the work, not just read about it.',
 sim:[
  {s:SCR.easy,say:'Type SU01 in the command field and press Enter.',a:{k:'cmd',v:'SU01'}},
  {s:SCR.su01i,say:'This is User Maintenance. You are inside a transaction, so use /n to switch. Type /nSM37 and press Enter.',a:{k:'cmd',v:'SM37'}},
  {s:SCR.sm37i,say:'This is the batch job selection screen. Now switch again. Type /nSE16N and press Enter.',a:{k:'cmd',v:'SE16N'}},
  {s:SCR.se16ni,say:'The table viewer. You have moved across three transactions with the command field only. Click Next.',a:{k:'read'}}],
 files:[],
 lab:{intro:'Match each job to the transaction code.',tasks:[
  {q:'You need to see which batch jobs failed last night. Which T-code?',t:'mcq',o:['SM37','SU01','SCC4'],a:0,why:'SM37 is the job overview.'},
  {q:'You need to see the roles and profiles of one user. Which T-code?',t:'mcq',o:['STMS','SU01','SE16N'],a:1,why:'SU01 displays one user, including roles and profiles.'},
  {q:'You need the raw contents of the table USR02. Which T-code?',t:'mcq',o:['SE16N','PFCG','SM20'],a:0,why:'SE16N is the data browser for tables.'},
  {q:'You are inside SU01 and want to jump to SM37. What do you type?',t:'txt',a:['/nsm37','/n sm37'],why:'/n closes the current transaction and opens the new one.'}]},
 tb:[{title:'Explain it simply',prompt:'Explain what a transaction code is and name five you would use as a controls tester, with what each one shows.',model:'A transaction code is a short code typed in the command field that opens a specific SAP function directly. As a controls tester I use SU01 to look at one user, SUIM for access reports, SE16N to display tables, STMS for transports, SM37 for batch jobs and SM20 for the security audit log. Typing /n before the code switches transactions without going back to the menu.',pts:['Defines a T-code as a shortcut typed in the command field','Names five codes correctly','Says what each one shows','Mentions /n']}],
 quiz:[
  {q:'Where do you type a transaction code?',o:['The command field','The password field','The status bar'],a:0,e:'The command field at the top left of the screen.'},
  {q:'What does /n do before a code?',o:['Opens a new window','Ends the current transaction and opens the new one','Deletes data'],a:1,e:'/o opens a new window. /n replaces the current screen.'},
  {q:'Which T-code shows the security audit log?',o:['SM20','SU01','SCC4'],a:0,e:'SM20 shows the security audit log, if it was switched on.'},
  {q:'Which T-code manages transports between systems?',o:['STMS','SUIM','SM37'],a:0,e:'STMS is the Transport Management System.'}]},

{id:'0.3',wk:'Week 0: SAP orientation (no interview questions yet)',title:'Users, user types, locks and roles',time:'about 2.5 hours',
 learn:[
  {h:'The user master',p:'Every person or program that uses SAP has a <b>user master record</b>, maintained in SU01. It holds the user type, validity dates, roles and profiles. Behind the screen, the main table is <b>USR02</b>.'},
  {h:'User types',p:'<b>A Dialog</b>: a person logging on. <b>B System</b> and <b>C Communication</b>: background and interface users, no screen logon. <b>S Service</b>: shared, anonymous access. Auditors ask for dialog users to be tied to a real person, and system IDs to be controlled differently.'},
  {h:'Locks and dates',p:'<b>UFLAG</b> is the lock flag: 0 = not locked, 32 = locked by central admin, 64 = locked by administrator, 128 = locked after wrong passwords. <b>GLTGB</b> is the valid-through date. 31.12.9999 means no end date. <b>TRDAT</b> is the last logon date.'},
  {h:'Roles and profiles',p:'A <b>role</b> (built in PFCG) bundles authorizations: what a user may do. SAP creates a <b>profile</b> from the role. <b>SAP_ALL</b> is a profile that contains every authorization, so it should almost never be assigned to a person.'}],
 why:'SoD, leavers and privileged access questions all start from these fields. You will use USR02 columns in almost every test.',
 sim:[
  {s:SCR.easy,say:'Type SU01 and press Enter.',a:{k:'cmd',v:'SU01'}},
  {s:SCR.su01i,say:'Type the user name AHUGHES in the User field.',a:{k:'type',id:'fUser',v:'AHUGHES'}},
  {s:SCR.su01i,say:'Click Display.',a:{k:'click',id:'bDisp'}},
  {s:()=>SCR.su01d('AHUGHES','addr'),say:'Click the Logon data tab.',a:{k:'click',id:'tLogon'}},
  {s:()=>SCR.su01d('AHUGHES','logon'),say:'Note the user type (Dialog), the valid-through date and the last logon. Now click the Roles tab.',a:{k:'click',id:'tRoles'}},
  {s:()=>SCR.su01d('AHUGHES','roles'),say:'This user has one role, Z_FI_AP_CLERK (accounts payable clerk). Click Next.',a:{k:'read'}}],
 files:[UX],
 lab:{intro:'Open <b>'+UX+'</b>, sheet <b>USR02</b>. It is the Thornfield user table, extracted on 2026-10-31. Use Excel filters and COUNTIF.',tasks:[
  {q:'How many users are in the USR02 extract?',t:'num',a:ANS.users_total,why:'Count the rows (excluding the header). Always note the total: it is your population.'},
  {q:'How many of them are dialog users (USTYP = A)?',t:'num',a:ANS.type_a,why:'Filter column USTYP on A.'},
  {q:'How many users are locked by an administrator (UFLAG = 64)?',t:'num',a:ANS.locked64,why:'Filter column UFLAG on 64.'},
  {q:'Which user types (letters) are not meant for a person to log on at a screen? Answer as letters separated by commas.',t:'set',a:['B','C','S'],why:'B system, C communication and S service users are for programs and shared access.'}]},
 tb:[{title:'Explain it simply',prompt:'Explain the different SAP user types and why an auditor cares about the difference.',model:'SAP has dialog users for people, system and communication users for background jobs and interfaces, and service users for shared anonymous access. An auditor cares because dialog users must be tied to a named person and reviewed at leaver and access-review time, whereas system and service IDs need other controls: no interactive logon, tightly limited authorizations, and an owner. Mixing them up means either missing a real person with access or flagging a batch ID incorrectly.',pts:['Names dialog, system, communication, service','Dialog = person, tied to a named individual','System and service IDs need different controls','Links to leavers and access reviews']}],
 quiz:[
  {q:'Which user type is used by a person logging on at a screen?',o:['A Dialog','B System','S Service'],a:0,e:'A Dialog is the interactive user type.'},
  {q:'What does a valid-through date of 31.12.9999 mean?',o:['The account has no end date','The account was deleted','The password has expired'],a:0,e:'It is the default "no end date" value.'},
  {q:'UFLAG 64 means the user is...',o:['Not locked','Locked by an administrator','Locked after wrong passwords'],a:1,e:'64 is an administrator lock. 128 is locked after wrong passwords.'},
  {q:'SAP_ALL is...',o:['A profile with every authorization','A display-only role','A report'],a:0,e:'SAP_ALL contains all authorizations, which is why it is so sensitive.'}]},

{id:'0.4',wk:'Week 0: SAP orientation (no interview questions yet)',title:'Reading SAP tables with SE16N, then analysing them in Excel',time:'about 2.5 hours',
 learn:[
  {h:'Tables are the evidence',p:'SAP stores everything in tables. Controls testers pull tables as evidence: <b>USR02</b> (users), <b>UST04</b> (profiles assigned to users), <b>E070</b> (transport requests). You display them with SE16N and export to Excel.'},
  {h:'Population first, completeness always',p:'Take the population from SAP itself, not from a ticketing tool or a list the client prepared. Record the table, the filter, the date and time, and the row count. That is how you prove the population is complete.'},
  {h:'Excel moves you will use',p:'<b>Filter</b> a column. <b>COUNTIF</b> counts matches. <b>XLOOKUP</b> or <b>VLOOKUP</b> matches two lists (SAP users against HR). Compare dates directly with &gt; and &lt;. A <b>pivot table</b> counts by category.'}],
 why:'"Population from SAP, not the ticketing tool" is a stock phrase that interviewers listen for. It shows audit rigour.',
 sim:[
  {s:SCR.easy,say:'Type SE16N and press Enter.',a:{k:'cmd',v:'SE16N'}},
  {s:SCR.se16ni,say:'Type the table name USR02.',a:{k:'type',id:'fTable',v:'USR02'}},
  {s:SCR.se16ni,say:'Click the green Enter button in the toolbar (the check mark).',a:{k:'click',id:'enter'}},
  {s:SCR.se16ns,say:'Filter for locked users. Type 64 in the lock flag field (UFLAG).',a:{k:'type',id:'fUflag',v:'64'}},
  {s:SCR.se16ns,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.se16nr,say:'These are users locked by an administrator. Click Export to save the result to Excel.',a:{k:'click',id:'bExport'}},
  {s:SCR.se16ne,say:'Notice the file name carries the filter and date. Click Next.',a:{k:'read'}}],
 files:[UX],
 lab:{intro:'Use the same workbook <b>'+UX+'</b>. Review date for these questions: <b>'+ANS.review_date+'</b>.',tasks:[
  {q:'How many users have a valid-through date (GLTGB) earlier than 9999-12-31, meaning an end date has been set?',t:'num',a:ANS.gltgb_set,why:'Filter GLTGB for dates before 9999-12-31 (or COUNTIF with "<"&DATE(9999,12,31)).'},
  {q:'How many users have a last logon (TRDAT) within 30 days before the review date (on or after 2026-10-01)?',t:'num',a:ANS.active30,why:'COUNTIF(TRDAT,">="&DATE(2026,10,1)). Dates compare like numbers in Excel.'},
  {q:'Why is it a problem to test from a user list the client prepared in Excel?',t:'mcq',o:['It may be incomplete or altered; the population should come from SAP','Excel cannot read SAP data','Client lists are always longer'],a:0,why:'You cannot prove completeness of a list you did not extract yourself.'}]},
 tb:[{title:'Explain it simply',prompt:'Why do we take populations from SAP tables rather than from a ticketing tool or a client-prepared list? Say what you would record.',model:'The population must be complete, so I take it from SAP itself: the user table for access, the transport tables for changes. A ticketing tool only shows what someone logged, and a client-prepared list may have been filtered. I record the table, the selection criteria, the extraction date and time, the user who ran it and the row count, and keep a screenshot, so the population can be re-performed and shown to be complete.',pts:['Population comes from SAP, not tickets or client lists','Completeness is the reason','Records table, filters, date and row count','Keeps evidence so it can be re-performed']}],
 quiz:[
  {q:'Which table holds user master data, including lock flags?',o:['USR02','E070','UST04'],a:0,e:'USR02 holds user logon data. UST04 holds profile assignments. E070 holds transports.'},
  {q:'What should you record with an extract?',o:['Only the file name','Table, filters, date and time, and row count','Nothing, the file is enough'],a:1,e:'These details prove the extract is complete and repeatable.'},
  {q:'Which Excel function counts rows matching a condition?',o:['COUNTIF','CONCAT','ROUND'],a:0,e:'COUNTIF counts matches.'},
  {q:'Why not use the ticketing tool as the population?',o:['It may miss changes that bypassed the process','It is always wrong','It cannot be exported'],a:0,e:'Anything done outside the ticketing process would be missing from it.'}]},

{id:'1.1',wk:'Week 1: ITGC foundations and audit frameworks (Q1, Q2, Q3, Q12, Q13, Q14, Q27, Q28, Q29, Q39)',title:'The three ITGC domains (Q1)',time:'about 2.5 hours',
 learn:[
  {h:'What ITGCs are',p:'IT general controls (ITGCs) are the controls around SAP that make the automated controls and reports inside it trustworthy. If a clerk can change a tolerance setting, you cannot rely on the automated three-way match.'},
  {h:'The three domains',p:'<table class="t"><tr><th>Domain</th><th>The risk</th><th>Where the evidence is</th></tr><tr><td>Access to programs and data</td><td>Someone posts or changes data without authority</td><td>SUIM, SU01, USR02, PFCG</td></tr><tr><td>Program change</td><td>An unapproved change breaks a control</td><td>STMS, E070, SCC4</td></tr><tr><td>IT operations</td><td>Jobs fail, interfaces drop, data is lost</td><td>SM37, interface logs, backup records</td></tr></table>Some firms add a fourth, <b>program development</b>, for new implementations.'},
  {h:'Why it matters: reliance',p:'The external auditor relies on automated controls and system reports only if ITGCs worked for the whole period. That one sentence is the heart of the answer.'}],
 why:'This is Question 1 in the bank. It sets the structure for every other technical answer.',
 sim:[
  {s:SCR.easy,say:'Domain 1, access. Type SUIM and press Enter.',a:{k:'cmd',v:'SUIM'}},
  {s:SCR.suimt,say:'SUIM holds the user and role reports. This is the evidence home for the access domain. Domain 2, change. Type /nSTMS and press Enter.',a:{k:'cmd',v:'STMS'}},
  {s:SCR.stmsO,say:'STMS shows the route DEV to QAS to PRD. This is the evidence home for program change. Domain 3, operations. Type /nSM37 and press Enter.',a:{k:'cmd',v:'SM37'}},
  {s:SCR.sm37i,say:'SM37 is the evidence home for batch jobs, part of IT operations. You have now seen the home screen of all three domains. Click Next.',a:{k:'read'}}],
 files:[],
 lab:{intro:'Sort each control into its ITGC domain.',tasks:[
  {q:'Quarterly review of who has access to the finance roles.',t:'mcq',o:['Access to programs and data','Program change','IT operations'],a:0,why:'User access review sits in the access domain.'},
  {q:'A change request must be approved before a transport is imported to production.',t:'mcq',o:['Access to programs and data','Program change','IT operations'],a:1,why:'Approval before import is a program change control.'},
  {q:'Failed bank interface jobs are investigated and re-run the same day.',t:'mcq',o:['Access to programs and data','Program change','IT operations'],a:2,why:'Job monitoring is IT operations.'},
  {q:'Why does the external auditor care that ITGCs work?',t:'mcq',o:['To rely on automated controls and system reports','To review IT staff performance','To test the network speed'],a:0,why:'Reliance on automated controls and reports depends on effective ITGCs.'}]},
 tb:[{n:1}],
 quiz:[
  {q:'How many core ITGC domains does the model answer name?',o:['Three','Seven','One'],a:0,e:'Access, change and operations (with program development sometimes added).'},
  {q:'Which domain does SM37 job monitoring belong to?',o:['Access','Program change','IT operations'],a:2,e:'Job scheduling and monitoring is IT operations.'},
  {q:'What is the closing point of a strong Q1 answer?',o:['Reliance by the external auditor on automated controls and reports','The names of the users','The number of transports'],a:0,e:'Link ITGCs to reliance.'},
  {q:'Which transaction would you name as evidence for program change?',o:['STMS','SU01','SM20'],a:0,e:'STMS and the transport tables show change history.'}]},

{id:'1.2',wk:'Week 1: ITGC foundations and audit frameworks (Q1, Q2, Q3, Q12, Q13, Q14, Q27, Q28, Q29, Q39)',title:'Privileged access: five users with SAP_ALL (Q3)',time:'about 3 hours',
 learn:[
  {h:'The scenario',p:'Your review shows five users with SAP_ALL in production. The interviewer wants to see calm, structured thinking. Do not shout "material weakness".'},
  {h:'The order of thinking',p:'1. <b>Confirm the facts</b>: is the profile really assigned and valid? 2. <b>Separate</b> locked emergency IDs from real exposure. 3. <b>Review activity</b>: did anyone use it (SM20, change documents)? 4. <b>Escalate</b> to your lead quickly. 5. <b>Assess impact</b> on reliance on other controls. 6. <b>Remediate</b>: remove, or route through a firefighter process with logging.'},
  {h:'Why locked emergency IDs differ',p:'An emergency ID kept locked, opened only through an approved process with logging and review, is a designed control. A named person with permanent SAP_ALL is an exposure.'}],
 why:'Q3 is a favourite because it tests judgement under pressure, not memory.',
 sim:[
  {s:SCR.easy,say:'Type SUIM and press Enter.',a:{k:'cmd',v:'SUIM'}},
  {s:SCR.suimt,say:'Click "Users by Complex Selection Criteria".',a:{k:'click',id:'tCrit'}},
  {s:SCR.suims,say:'Click the "By profiles" tab.',a:{k:'click',id:'tabProf'}},
  {s:SCR.suims,say:'Type SAP_ALL in the Profile field.',a:{k:'type',id:'fProf',v:'SAP_ALL'}},
  {s:SCR.suims,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.suimr,say:'Five users. Two are locked (the FF_ firefighter IDs). Three have no lock. Note each last logon date. Click Next.',a:{k:'read'}}],
 files:[UX],
 lab:{intro:'In <b>'+UX+'</b>, sheet <b>UST04</b> lists profiles assigned to each user. Join it to <b>USR02</b> (use XLOOKUP on BNAME). Review date: <b>'+ANS.review_date+'</b>.',tasks:[
  {q:'How many users have the profile SAP_ALL in UST04?',t:'num',a:ANS.sapall_total,why:'Filter PROFILE = SAP_ALL. Five users, matching the SUIM result.'},
  {q:'How many of them are locked (UFLAG = 64)?',t:'num',a:ANS.sapall_locked,why:'The FF_EMER IDs are locked emergency IDs.'},
  {q:'How many are active, unlocked dialog users?',t:'num',a:ANS.sapall_active,why:'These three are the real exposure.'},
  {q:'Which SAP_ALL users logged on in the 30 days before the review date? List the user names separated by commas.',t:'set',a:ANS.sapall_recent_names,why:'Check TRDAT (last logon). These two used their access recently, so review their activity first.'},
  {q:'Which active SAP_ALL user has not logged on since April 2026, so the access can probably be removed without disruption?',t:'txt',a:[ANS.sapall_stale.toLowerCase()],why:'TOLSEN last logged on on 2026-04-02. Still a finding, but the lowest urgency for activity review.'},
  {q:'What is your FIRST action?',t:'mcq',o:['Report a material weakness to the client board','Confirm the facts in SAP and separate locked emergency IDs from real exposure','Delete the three users'],a:1,why:'Facts before judgement. Never jump straight to "material weakness".'}]},
 tb:[{n:3}],
 quiz:[
  {q:'What does SAP_ALL give a user?',o:['Display access only','Every authorization in the system','Access to one module'],a:1,e:'It is the broadest profile in SAP.'},
  {q:'A locked emergency ID with SAP_ALL, opened only through an approved, logged process, is...',o:['Automatically a deficiency','A designed control, if the process is working','Irrelevant'],a:1,e:'The control is the lock plus approval, logging and review.'},
  {q:'After confirming the facts, what do you review?',o:['What the users did, using SM20 and change documents','The company logo','Only the HR file'],a:0,e:'Activity review tells you whether the access was abused.'},
  {q:'Whom do you tell, and when?',o:['Nobody until the report','Your engagement lead, promptly','The users themselves first'],a:1,e:'Escalate promptly. The lead decides on wider communication.'}]},

{id:'1.3',wk:'Week 1: ITGC foundations and audit frameworks (Q1, Q2, Q3, Q12, Q13, Q14, Q27, Q28, Q29, Q39)',title:'Testing user provisioning and leavers (Q27 and Q28)',time:'about 3.5 hours',
 learn:[
  {h:'Testing provisioning (Q27)',p:'Take the <b>population from SAP</b> (new users or role assignments in the period). Check <b>completeness and accuracy</b> of that population. Choose a <b>sample</b> using the methodology. For each item check <b>approval before access</b>, by the <b>right approver</b>, and that the <b>access granted matches the access approved</b>.'},
  {h:'Testing leavers (Q28)',p:'Do not accept "HR automates it". Get an <b>independent HR list of leavers</b> and check it is complete. Compare each leaver with the SAP lock or valid-through date against policy (here: within 2 days). Check <b>last logon after the leave date</b>. Test the automation itself as an application control. Look for <b>contractors and generic IDs</b> that HR does not know.'},
  {h:'Severity cues',p:'A leaver who still logged on after leaving is worse than one still active but unused. A late lock date is lower than an account still open.'}],
 why:'These are the two most asked access-control testing questions. Interviewers want you to walk from population to conclusion.',
 sim:[
  {s:SCR.easy,say:'Type SU01 and press Enter.',a:{k:'cmd',v:'SU01'}},
  {s:SCR.su01i,say:'Type the leaver name NHADDAD (Nadia Haddad).',a:{k:'type',id:'fUser',v:'NHADDAD'}},
  {s:SCR.su01i,say:'Click Display.',a:{k:'click',id:'bDisp'}},
  {s:()=>SCR.su01d('NHADDAD','addr'),say:'Click the Logon data tab.',a:{k:'click',id:'tLogon'}},
  {s:()=>SCR.su01d('NHADDAD','logon'),say:'HR says this person left on '+SIM.nh.term.split('-').reverse().join('.')+'. The valid-through date is still 31.12.9999 and the last logon is '+SIM.nh.last.split('-').reverse().join('.')+'. Click Next.',a:{k:'read'}}],
 files:[UX],
 lab:{intro:'In <b>'+UX+'</b> use <b>HR_Employees</b> (HR_STATUS = Terminated) and <b>USR02</b>. Policy: access must be end-dated or locked within <b>2 days</b> of the termination date. An open account has GLTGB 9999-12-31.',tasks:[
  {q:'How many leavers (HR status Terminated) are in the HR list?',t:'num',a:ANS.leavers,why:'Filter HR_STATUS = Terminated.'},
  {q:'How many leavers still have an open account (GLTGB = 9999-12-31, UFLAG = 0)?',t:'num',a:ANS.leavers_active,why:'XLOOKUP each leaver\'s SAP_USER into USR02.'},
  {q:'How many leavers were end-dated or locked, but MORE than 2 days after the termination date?',t:'num',a:ANS.leavers_late,why:'Subtract termination date from GLTGB. These were controlled, but late.'},
  {q:'Which leaver logged on AFTER the termination date? Enter the user name.',t:'txt',a:ANS.leavers_after.map(x=>x.toLowerCase()),why:'Compare TRDAT with the termination date. This is the most serious leaver exception: access was used after employment ended.'},
  {q:'How many dialog (type A) users in USR02 have NO record in the HR list?',t:'num',a:ANS.nohr,why:'These include contractors, generic IDs and the emergency IDs. HR cannot cover them, so the leaver process does not either.'},
  {q:'Excluding the two FF_ emergency IDs, how many are left?',t:'num',a:ANS.nohr_excl_ff,why:'CONSULT_IT, TEMP_PAY, SHARED_FIN and CONTR_AUD1: all need an owner and a separate review.'}]},
 tb:[{n:27},{n:28}],
 quiz:[
  {q:'Where do you take the population for the provisioning test?',o:['From SAP','From the ticketing tool only','From the client'],a:0,e:'SAP is the complete source.'},
  {q:'For a leaver test, which list do you need independently?',o:['HR leavers','Helpdesk tickets','The org chart'],a:0,e:'An independent HR leaver list lets you test every leaver, not just those the process caught.'},
  {q:'What does a last logon after the termination date suggest?',o:['Nothing','Access was used after employment ended','The password was changed'],a:1,e:'This is the strongest red flag and may need escalation.'},
  {q:'Which accounts does an HR-driven leaver process usually miss?',o:['Contractors and generic IDs','Managers','New starters'],a:0,e:'HR cannot see IDs it did not create.'}]},

{id:'1.4',wk:'Week 1: ITGC foundations and audit frameworks (Q1, Q2, Q3, Q12, Q13, Q14, Q27, Q28, Q29, Q39)',title:'Change management and transports (Q2)',time:'about 3.5 hours',
 learn:[
  {h:'How a change travels',p:'A developer builds a change in <b>DEV</b>. It is stored in a <b>transport request</b>. After testing in <b>QAS</b> and approval, Basis imports it into <b>PRD</b> through <b>STMS</b>. The transport tables (<b>E070</b>) record who created and imported each request.'},
  {h:'What you test',p:'Take the <b>population from SAP</b> (all transports imported to PRD in the period), not from tickets. For a sample check: ticket and <b>approval before import</b>; <b>test evidence</b>; and <b>segregation</b>: the developer does not import his own change. Check production is locked (<b>SCC4</b>, <b>SE06</b>).'},
  {h:'Emergency changes',p:'Emergencies may skip normal approval, but need <b>retrospective approval</b> within an agreed time (here: 5 days).'}],
 why:'Q2 has a built-in trap: if you start from the ticket list you will never see the changes that bypassed the process.',
 sim:[
  {s:SCR.easy,say:'Type STMS and press Enter.',a:{k:'cmd',v:'STMS'}},
  {s:SCR.stmsO,say:'Click the PRD system row.',a:{k:'click',id:'rPRD'}},
  {s:SCR.stmsQ,say:'This is the queue of requests waiting. Click Import History to see what has already been imported.',a:{k:'click',id:'bHist'}},
  {s:SCR.stmsH,say:'Look at the Owner and Imported by columns. One request was imported by the same person who owns it (highlighted). That breaks segregation. Click Next.',a:{k:'read'}}],
 files:[TX],
 lab:{intro:'Open <b>'+TX+'</b>. Sheet <b>E070_Transports</b> lists the transports imported to PRD between January and September 2026. Sheet <b>Ticket_Tool</b> lists the tickets the client says it processed.',tasks:[
  {q:'How many transports were imported into production (rows in E070_Transports)?',t:'num',a:ANS.tr_total,why:'This SAP population is your complete list.'},
  {q:'How many change tickets are in the Ticket_Tool sheet?',t:'num',a:ANS.tickets,why:'The ticket tool is short by '+(ANS.tr_total-ANS.tickets)+' compared with SAP.'},
  {q:'How many transports have NO ticket (blank TICKET column)?',t:'num',a:ANS.tr_noticket,why:'These were imported with no recorded request, so they bypassed the process.'},
  {q:'How many transports were imported BEFORE their approval date?',t:'num',a:ANS.tr_before_approval,why:'Compare IMPORT_DATE with APPROVAL_DATE. Approval must come first.'},
  {q:'Which transport was imported by the same user who created it? Enter the transport number.',t:'txt',a:[ANS.tr_own.toLowerCase()],why:'Compare AS4USER with IMPORTED_BY. A developer importing his own change is a segregation failure.'},
  {q:'How many emergency changes (EMERGENCY = Y) have NO retrospective approval date?',t:'num',a:ANS.tr_emerg_noretro,why:'One of '+ANS.tr_emerg+' emergency changes was never approved afterwards.'},
  {q:'The client says its ticket tool is the full list of changes. Which population do you test from?',t:'mcq',o:['The ticket tool','The SAP transport tables','Whichever is shorter'],a:1,why:'SAP shows what actually reached production, including changes outside the process.'}]},
 tb:[{n:2}],
 quiz:[
  {q:'The route for a normal change is...',o:['DEV to QAS to PRD','PRD to DEV','QAS to DEV to PRD'],a:0,e:'Build in DEV, test in QAS, import to PRD.'},
  {q:'Why take the population from transport tables, not tickets?',o:['Tickets miss changes that bypassed the process','Tickets are always wrong','SAP is faster'],a:0,e:'Only SAP shows what actually reached production.'},
  {q:'What is the segregation control for transports?',o:['A developer does not import his own change','Everyone imports their own','Only one person ever works on SAP'],a:0,e:'The creator and the importer must be different people.'},
  {q:'What does an emergency change still need?',o:['Retrospective approval','Nothing','A new client'],a:0,e:'It can skip prior approval but must be approved afterwards.'}]},

{id:'1.5',wk:'Week 1: ITGC foundations and audit frameworks (Q1, Q2, Q3, Q12, Q13, Q14, Q27, Q28, Q29, Q39)',title:'IT operations: batch jobs and interfaces (Q29)',time:'about 3 hours',
 learn:[
  {h:'What matters for financial reporting',p:'Not every job is relevant. Focus on <b>financially relevant jobs and interfaces</b>: payment runs, bank interfaces, period-end postings. If a bank interface job fails and nobody notices, payments or cash postings are missing.'},
  {h:'The tests',p:'1. Who can <b>schedule or change</b> the jobs? (Access control.) 2. Take <b>failed jobs from SM37</b> and trace each to a resolution or re-run. 3. Check <b>interface errors and reconciliations</b>. 4. Check <b>backups and tested restores</b>.'},
  {h:'The key idea',p:'A cancelled job is evidence of a problem. The <i>control</i> is that someone notices and fixes it. Test that.'}],
 why:'Q29 checks whether you know that operations controls are about follow-up and access, not just job logs.',
 sim:[
  {s:SCR.easy,say:'Type SM37 and press Enter.',a:{k:'cmd',v:'SM37'}},
  {s:SCR.sm37i,say:'Type Z* in the job name field to select all custom (Z) jobs.',a:{k:'type',id:'fJob',v:'Z*'}},
  {s:SCR.sm37i,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.sm37r,say:'One job is Canceled (red). Click that row.',a:{k:'click',id:'rAbort'}},
  {s:SCR.sm37r,say:'Click Job log to see why it failed.',a:{k:'click',id:'bLog'}},
  {s:SCR.sm37l,say:'The bank gateway timed out. Your test question is: did someone notice, re-run the job and record it? Click Next.',a:{k:'read'}}],
 files:[JX],
 lab:{intro:'Open <b>'+JX+'</b>. Sheet <b>SM37_JobLog</b> has 30 days of runs for three financial jobs. STATUS A = aborted, F = finished. Sheet <b>Job_Schedule_Changes</b> lists who changed the schedules.',tasks:[
  {q:'How many job runs are in the log?',t:'num',a:ANS.job_total,why:'3 jobs x 30 days = 90 runs.'},
  {q:'How many runs were aborted (STATUS = A)?',t:'num',a:ANS.job_aborted,why:'Filter STATUS on A.'},
  {q:'Which job aborted most often? Enter the job name.',t:'txt',a:[ANS.job_top.toLowerCase()],why:'Pivot or COUNTIFS by job. Z_BANK_INTERFACE aborted '+ANS.job_top_n+' times.'},
  {q:'How many aborted runs had NO successful re-run the same day (RERUN_SUCCESS_SAME_DAY = N)?',t:'num',a:ANS.job_norerun,why:'These days have missing or late processing.'},
  {q:'Of those, how many have NO incident reference?',t:'num',a:ANS.job_noref,why:'No re-run and no incident means nobody followed up. That is the control failure.'},
  {q:'In Job_Schedule_Changes, which job was changed by a Finance user without a ticket? Enter the job name.',t:'txt',a:[ANS.job_changes_nonbasis.toLowerCase()],why:'A finance user replacing a job step program with no ticket is an access and change exception.'}]},
 tb:[{n:29}],
 quiz:[
  {q:'Which jobs do you focus on?',o:['Financially relevant jobs and interfaces','All jobs equally','Only jobs that start with A'],a:0,e:'Use judgement based on financial reporting relevance.'},
  {q:'A cancelled job proves...',o:['A control failed','Only that the job failed; test whether it was followed up','Nothing'],a:1,e:'The control is the follow-up, not the job itself.'},
  {q:'Who should be able to schedule or change financial jobs?',o:['Any user','A restricted, controlled group','The job owner only'],a:1,e:'Restrict scheduling access and review it.'},
  {q:'Backups matter only if...',o:['Restores are tested','They are large','They are daily'],a:0,e:'An untested backup is not evidence you can recover.'}]},

{id:'1.6',wk:'Week 1: ITGC foundations and audit frameworks (Q1, Q2, Q3, Q12, Q13, Q14, Q27, Q28, Q29, Q39)',title:'SOX, COSO, COBIT and the Three Lines (Q12, Q13, Q14, Q39)',time:'about 3 hours',
 learn:[
  {h:'SOX 302 and 404 (Q12)',p:'<b>302</b>: the CEO and CFO certify each quarter. <b>404(a)</b>: management assesses internal control over financial reporting. <b>404(b)</b>: the external auditor gives an opinion for larger filers. IT controls support the reliance on systems.'},
  {h:'COSO (Q13)',p:'Five components: <b>control environment, risk assessment, control activities, information and communication, monitoring</b>. There are <b>17 principles</b>. Principle 11 covers general controls over technology.'},
  {h:'COBIT versus COSO (Q39)',p:'COSO is the internal control framework used for financial reporting. COBIT (ISACA) is an IT governance and management framework, wider than financial reporting. It is often used to structure ITGCs under COSO.'},
  {h:'Three Lines (Q14)',p:'<b>First</b>: management owns and operates controls. <b>Second</b>: risk and compliance oversight. <b>Third</b>: internal audit. The external auditor sits outside the model. A consultant protects <b>independence</b>: do not test your own design or operate controls.'}],
 why:'These four are conversation questions. No SAP screens, but the interviewer tests whether you can speak the language of the audit committee.',
 sim:[],files:[],
 lab:{intro:'Short scenarios. Choose the best answer.',tasks:[
  {q:'Who certifies the financial statements and internal controls every quarter?',t:'mcq',o:['CEO and CFO (Section 302)','External auditor only','Internal audit'],a:0,why:'Section 302.'},
  {q:'Which COSO component covers management\'s ongoing reviews and evaluations of controls?',t:'mcq',o:['Control environment','Monitoring','Risk assessment'],a:1,why:'Monitoring.'},
  {q:'Which framework would you use to structure an IT governance assessment beyond financial reporting?',t:'mcq',o:['COSO','COBIT','SOX'],a:1,why:'COBIT is the wider IT governance framework.'},
  {q:'You designed a control for a client and now are asked to test it. What is the problem?',t:'mcq',o:['None','Independence: you would be testing your own design','You are too expensive'],a:1,why:'Protect independence. Do not test your own design.'},
  {q:'Where does the external auditor sit in the Three Lines model?',t:'mcq',o:['First line','Third line','Outside the model'],a:2,why:'The external auditor is outside the Three Lines, though it interacts with all three.'}]},
 tb:[{n:12},{n:13},{n:14},{n:39}],
 quiz:[
  {q:'How many COSO components are there?',o:['3','5','17'],a:1,e:'Five components and 17 principles.'},
  {q:'Section 404(b) requires...',o:['An external auditor opinion on internal control for larger filers','Quarterly CEO certification','An IT budget'],a:0,e:'404(a) is management\'s assessment, 404(b) the auditor\'s opinion.'},
  {q:'COBIT is mainly...',o:['IT governance and management','A tax standard','A software product'],a:0,e:'It is an ISACA framework.'},
  {q:'First line of defence is...',o:['Management who own and operate the controls','Internal audit','External audit'],a:0,e:'First line = management.'}]}
];
// teach-back lookups from the bank
UNITS.forEach(u=>u.tb=u.tb.map(t=>t.n?{title:'Q'+t.n+'. '+QS[t.n].title,prompt:QS[t.n].question,model:QS[t.n].answer,pts:QS[t.n].key,n:t.n}:t));

const SX='Thornfield_SoD_Extract.xlsx',FX='Thornfield_Firefighter_Log.xlsx',AX='Thornfield_Access_Review_Extract.xlsx',CX='Thornfield_Control_Test_Sample.xlsx',IX='Thornfield_Sampling_and_Report_Reliance.xlsx';
const W2T='Week 2: Access risk, SoD and testing approach (Q4, Q5, Q6, Q7, Q8, Q9, Q30, Q31, Q32, Q33, Q34)';

{id:'2.1',wk:W2T,title:'Segregation of duties and access risk analysis (Q4 and Q30)',time:'about 3.5 hours',
 learn:[
  {h:'SoD in plain words (Q4)',p:'No single person should be able to <b>start, approve and hide</b> a transaction. The classic SAP example: one user can change a vendor\'s bank account (XK02 or the business partner transaction) <b>and</b> run the payment program (F110). They could redirect a payment to their own account.'},
  {h:'How GRC finds conflicts (Q30)',p:'The ruleset defines <b>risks</b>. Each risk is made of two <b>functions</b> (for example vendor maintenance and payment processing). Each function is a list of <b>actions</b> (transactions), optionally refined with <b>permissions</b> (authorization object values). Analysis at <b>action level</b> is broad. At <b>permission level</b> it is precise and removes false positives.'},
  {h:'Is the result reliable?',p:'The ruleset must be complete and approved, with <b>change control</b> (deleting a risk makes conflicts disappear). The <b>sync jobs</b> must have run so the data is current. All systems and user types must be covered. You can <b>re-run a sample</b> to confirm.'},
  {h:'After you find a conflict',p:'Ask: is the access <b>used</b>? Is it <b>mitigated</b>? Unused access can be removed with no business impact. That is the quick win.'}],
 why:'Q4 is the best opener in any SAP audit interview. Q30 separates people who have only seen GRC reports from people who understand why the reports can be wrong.',
 sim:[
  {s:SCR.grcHome,say:'Open Access Risk Analysis.',a:{k:'click',id:'tARA'}},
  {s:SCR.araSel,say:'Type the user CMENDEZ.',a:{k:'type',id:'fUser',v:'CMENDEZ'}},
  {s:SCR.araSel,say:'Click Run analysis.',a:{k:'click',id:'bExec'}},
  {s:SCR.araRes,say:'Two risks. Each is two functions caused by two roles. Notice the user has four roles. Click Next.',a:{k:'read'}}],
 files:[SX],
 lab:{intro:'Open <b>'+SX+'</b>. <b>AGR_USERS</b> lists roles per user. <b>ROLE_FUNCTION_MAP</b> maps each role to a function. <b>RULESET</b> defines four risks as pairs of functions. Method: add the function to each role row (XLOOKUP), then for each user check whether he or she has <i>both</i> functions of a risk.',tasks:[
  {q:'How many users are in the AGR_USERS sheet?',t:'num',a:ANS.sod_users_total,why:'Count distinct users.'},
  {q:'How many risks are defined in the RULESET?',t:'num',a:4,why:'R1 to R4.'},
  {q:'How many conflicts are there in total (a user holding both functions of a risk counts once per risk)?',t:'num',a:ANS.sod_conf,why:'Eight user-risk conflicts.'},
  {q:'How many distinct users have at least one conflict?',t:'num',a:ANS.sod_users,why:'Seven users. One user has two different risks.'},
  {q:'Which risk has the most conflicts? Enter the risk ID.',t:'txt',a:['r1'],why:'R1, vendor maintenance and payment processing: the most dangerous in purchase to pay.'},
  {q:'Which user has conflicts under two different risks? Enter the user name.',t:'txt',a:[ANS.sod_two.toLowerCase()],why:'CMENDEZ matches your simulator result.'},
  {q:'How many of the conflicts involve a conflicting role that was NOT used in the last 90 days (USED_IN_LAST_90_DAYS = N)?',t:'num',a:ANS.sod_removable,why:'These can be removed with little or no business impact, the quickest way to reduce risk.'},
  {q:'You are asked to lead remediation of hundreds of conflicts. What do you do FIRST?',t:'mcq',o:['Remove access user by user','Confirm the ruleset is right and remove false positives (permission-level analysis)','Mitigate everything'],a:1,why:'Make sure the numbers are real before acting.'}]},
 tb:[{n:4},{n:30}],
 quiz:[
  {q:'What is a function in a GRC ruleset?',o:['A set of actions such as transaction codes','A user','A report'],a:0,e:'A risk is made of functions, and a function is a set of actions.'},
  {q:'Permission-level analysis compared with action level is...',o:['More precise, fewer false positives','Less precise','The same'],a:0,e:'It checks authorization values, not just transactions.'},
  {q:'Why does ruleset change control matter?',o:['Removing a risk would make conflicts disappear','It makes reports faster','It is optional'],a:0,e:'Weak control over the ruleset undermines every result.'},
  {q:'Which conflict is classic in purchase to pay?',o:['Vendor master change plus payment run','Display plus display','Report plus print'],a:0,e:'Change bank details and pay.'}]},

{id:'2.2',wk:W2T,title:'Emergency (firefighter) access (Q5)',time:'about 3 hours',
 learn:[
  {h:'What it is',p:'Emergency access gives temporary, powerful access to fix urgent problems. In GRC the user <b>requests</b> a firefighter ID with a reason and ticket. The session is <b>logged</b> (transactions and changes). An independent <b>controller</b> reviews the log within an agreed time.'},
  {h:'How to test it',p:'Take the <b>population from GRC</b> and check it is <b>complete</b> by comparing with the logons to the firefighter IDs in the security audit log (SM20). Sample sessions and check: valid <b>reason and ticket</b>; <b>activity matches the reason</b>; the controller reviewed <b>on time</b> and is <b>independent</b>; owner and controller assignments are valid.'},
  {h:'The sneaky one',p:'Logons to the firefighter ID in SM20 with <b>no GRC session</b> mean someone used the ID outside the process. That is a serious finding.'}],
 why:'Q5 tests whether you understand that a powerful ID is only acceptable because of the logging and review around it.',
 sim:[
  {s:SCR.grcHome,say:'Open Emergency Access Management.',a:{k:'click',id:'tEAM'}},
  {s:SCR.ffLog,say:'Click the red session. Its logged activity may not match the stated reason.',a:{k:'click',id:'rFF3'}},
  {s:SCR.ffDet,say:'The stated reason is to unlock a user, but the log shows a journal posting (FB01). This is what the controller must catch. Click Next.',a:{k:'read'}}],
 files:[FX],
 lab:{intro:'Open <b>'+FX+'</b>. <b>GRC_FF_SESSIONS</b> lists firefighter sessions. <b>SM20_FF_LOGONS</b> lists the logons to the firefighter IDs in the audit log. A review is on time if completed within <b>5 days</b> of the session.',tasks:[
  {q:'How many sessions are in GRC?',t:'num',a:ANS.ff_sessions,why:'Population from GRC.'},
  {q:'How many logons to firefighter IDs are in the SM20 sheet?',t:'num',a:ANS.ff_sm20,why:'The audit log is the independent check on GRC.'},
  {q:'How many SM20 logons have NO matching GRC session?',t:'num',a:ANS.ff_gap,why:'Blank MATCHING_GRC_SESSION. These may be use of the ID outside the process.'},
  {q:'How many sessions have no ticket?',t:'num',a:ANS.ff_noticket,why:'Every session needs a reason linked to a ticket.'},
  {q:'How many sessions were reviewed MORE than 5 days after the session?',t:'num',a:ANS.ff_late,why:'REVIEW_DATE minus SESSION_DATE greater than 5.'},
  {q:'How many sessions have no review date at all?',t:'num',a:ANS.ff_noreview,why:'The review control did not operate for this session.'},
  {q:'Which session was "reviewed" by the same person who used it? Enter the session ID.',t:'txt',a:[ANS.ff_self.toLowerCase()],why:'Controller equals user: not independent.'},
  {q:'How many sessions have an activity that does not match the stated reason (reason: unlock a user, activity includes a journal posting)?',t:'num',a:ANS.ff_mismatch,why:'The review should have caught these.'},
  {q:'What do you do about the 2 SM20 logons with no GRC session?',t:'mcq',o:['Ignore, GRC is the system of record','Investigate as possible use outside the process and escalate to your lead','Delete the IDs'],a:1,why:'Treat it as a potential bypass of the control.'}]},
 tb:[{n:5}],
 quiz:[
  {q:'Who should review a firefighter session?',o:['The user himself','An independent controller','Anyone'],a:1,e:'Independence is the point.'},
  {q:'What is the independent check on completeness of the GRC session list?',o:['The security audit log (SM20)','The org chart','A survey'],a:0,e:'Compare logons to the firefighter IDs with GRC sessions.'},
  {q:'What must a session link to?',o:['A reason and ticket','A budget','A report'],a:0,e:'Reason and ticket justify the access.'},
  {q:'A firefighter ID with SAP_ALL is acceptable if...',o:['It is controlled, logged and reviewed','Nobody knows about it','It is shared'],a:0,e:'The control is the process around the ID.'}]},

{id:'2.3',wk:W2T,title:'Mitigating controls and user access reviews (Q31 and Q32)',time:'about 3.5 hours',
 learn:[
  {h:'Accepting a mitigating control (Q31)',p:'Treat it like any control and test it. Does it address the <b>specific risk</b>? A general monthly expense review does not mitigate "change vendor bank details and pay". Is it <b>independent</b>? <b>Precise and frequent</b> enough? Is there <b>evidence every period</b>? In GRC check it is <b>assigned</b> to the user and risk with a valid date range and an owner. Otherwise remove, split or redesign the access.'},
  {h:'What makes an access review work (Q32)',p:'The list reviewers see must be <b>complete</b> (agree it to a system extract of the same date). It must be <b>understandable</b>. There must be <b>evidence of real review</b>, not approving everything. Sign-off must be <b>timely</b>. <b>Removals must happen</b>: trace them to SAP change documents. The reviewer must be <b>independent of the security admin</b>.'}],
 why:'Q31 and Q32 are about judgement: do not accept "we have a control" or "we did a review" without testing it.',
 sim:[
  {s:SCR.grcHome,say:'Open Mitigating Controls to see one assignment.',a:{k:'click',id:'tMIT'}},
  {s:SCR.mitAssign,say:'Check the "Valid to" date against the review date of 31 October 2026. Click Next.',a:{k:'read'}},
  {s:SCR.easy,say:'Now trace a removal. Type SUIM.',a:{k:'cmd',v:'SUIM'}},
  {s:SCR.suimt,say:'Click "Users by Complex Selection Criteria" (change documents are reached from here in this simulation).',a:{k:'click',id:'tCrit'}},
  {s:SCR.suimChg,say:'Type the user '+W2.unrem+', whose removal was requested by the reviewer.',a:{k:'type',id:'fUser',v:W2.unrem}},
  {s:SCR.suimChg,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.suimChgR,say:'No change documents. The removal was requested but never made in SAP. Click Next.',a:{k:'read'}}],
 files:[AX],
 lab:{intro:'Open <b>'+AX+'</b>. Sheets: <b>SYSTEM_EXTRACT</b> (all users at 2026-09-30), <b>REVIEW_LIST</b> (the list reviewers received, with decisions), <b>REMOVALS_IN_SAP</b>, <b>MITIGATIONS</b>. Review sign-off deadline: <b>2026-10-15</b>. Review date: <b>2026-10-31</b>.',tasks:[
  {q:'How many users are in the system extract but NOT in the review list?',t:'num',a:ANS.ar_missing,why:'The list given to reviewers was incomplete: the service and generic IDs were missed.'},
  {q:'How many users did reviewers decide to Keep?',t:'num',a:ANS.ar_keep,why:'30 of 36 kept.'},
  {q:'How many removals were requested, and how many of them appear in SAP with a removal date? Enter the number NOT processed.',t:'num',a:ANS.ar_notremoved,why:'Two removals were asked for and never made.'},
  {q:'How many reviews were signed off AFTER the 2026-10-15 deadline?',t:'num',a:ANS.ar_late,why:'Compare SIGNOFF_DATE with the deadline.'},
  {q:'How many users were reviewed by SEC_ADMIN (the security administrator)?',t:'num',a:ANS.ar_sec,why:'The security admin should not review the access he or she grants.'},
  {q:'Which mitigating control assignment has expired? Enter the user name.',t:'txt',a:[ANS.ar_exp_user.toLowerCase()],why:'VALID_TO 2026-08-31 is before the review date.'},
  {q:'Which user\'s mitigating control does NOT address the vendor-payment risk R1 (general expense review)? Enter the user name.',t:'txt',a:['dpatel'],why:'A monthly expense review does not catch a changed bank account before payment.'},
  {q:'How many mitigations have evidence for fewer than 12 months of the year?',t:'num',a:ANS.ar_short,why:'The control did not operate every period, so the mitigation cannot be relied upon for the whole year.'}]},
 tb:[{n:31},{n:32}],
 quiz:[
  {q:'A mitigating control must...',o:['Address the specific risk','Be a general review','Be undocumented'],a:0,e:'It has to match the risk.'},
  {q:'How do you check an access review list is complete?',o:['Agree it to a system extract on the same date','Ask the reviewer','Count the pages'],a:0,e:'Completeness comes from SAP.'},
  {q:'A reviewer who keeps every user suggests...',o:['A good review','A possible rubber stamp','Nothing'],a:1,e:'Look for evidence of real review such as questions or removals.'},
  {q:'Requested removals should be traced to...',o:['SAP change documents','The email','The org chart'],a:0,e:'Proof it happened is in SAP.'}]},

{id:'2.4',wk:W2T,title:'Design versus operating effectiveness, and the workpaper (Q6 and Q7)',time:'about 3.5 hours',
 learn:[
  {h:'Design (Q6)',p:'Would the control, <b>if it works as described</b>, prevent or detect the risk? Test it first, usually with a <b>walkthrough</b>: follow one transaction end to end. Check coverage, independence, timing and precision.'},
  {h:'Operating effectiveness',p:'Did it <b>actually work all period</b>? Test a <b>sample</b> across the period. If design fails, stop and escalate: there is no point testing operation of a control that could not work.'},
  {h:'The workpaper (Q7)',p:'A reviewer who was not there must be able to <b>re-perform</b> it. It states the control, risk and objective, the <b>population source and completeness</b>, the <b>sample method</b>, a result for each item with <b>cross-referenced evidence</b>, how <b>exceptions</b> were evaluated, a <b>conclusion</b> that matches the results, and preparer and reviewer sign-off.'}],
 why:'Interviewers use Q6 to see whether you know the order of testing, and Q7 to see whether you have worked under a reviewer.',
 sim:[
  {s:SCR.easy,say:'Walkthrough of control FI-AP-07: the population is vendor bank changes. Type FK03.',a:{k:'cmd',v:'FK03'}},
  {s:SCR.fk03i,say:'Type vendor 100245.',a:{k:'type',id:'fVend',v:'100245'}},
  {s:SCR.fk03i,say:'Click Display.',a:{k:'click',id:'bDisp'}},
  {s:SCR.fk03d,say:'Click Account changes to see the change log for the vendor.',a:{k:'click',id:'bChg'}},
  {s:SCR.fk03c,say:'You followed one bank change end to end: who changed it, when, old and new value. This is a design walkthrough. Click Next.',a:{k:'read'}}],
 files:[CX],
 lab:{intro:'Open <b>'+CX+'</b>. Sheet <b>CONTROL</b> describes control FI-AP-07. Sheet <b>SAMPLE</b> has 10 of the 52 weekly occurrences. The review must be done <b>before the payment run date</b> and by someone <b>other than the person who made the changes</b>.',tasks:[
  {q:'DESIGN: the control names one reviewer and no backup. Is that a design concern?',t:'mcq',o:['Yes, the control cannot operate when the reviewer is absent','No, one reviewer is enough','No, backups are only for IT'],a:0,why:'Without a backup the control depends on one person being available every week.'},
  {q:'How many sample items are in the SAMPLE sheet?',t:'num',a:ANS.ct_n,why:'For a weekly control a methodology table usually gives 5 to 15.'},
  {q:'How many sample weeks have REVIEWED = N?',t:'num',a:ANS.ct_notrev,why:'No review at all.'},
  {q:'How many reviews were done AFTER the payment run date?',t:'num',a:ANS.ct_late,why:'A review after the payment run cannot prevent a fraudulent payment. It is still an exception.'},
  {q:'How many weeks had the changer and the reviewer as the same person?',t:'num',a:ANS.ct_self,why:'No independence.'},
  {q:'How many exceptions in total, and what is the deviation rate as a whole percent? Enter the percent.',t:'num',a:ANS.ct_rate,why:ANS.ct_exc+' of '+ANS.ct_n+' = '+ANS.ct_rate+'%.'},
  {q:'WORKPAPER: a draft says "Population: client spreadsheet. Sample: 10 weeks. Result: minor exceptions noted." What will a reviewer send back?',t:'mcq',o:['Population source not from SAP or not proven complete, and exceptions not specifically described','Nothing, it is complete','The font'],a:0,why:'Population completeness, sample method and specific exceptions are required. "Minor" without evaluation is a red flag.'}]},
 tb:[{n:6},{n:7}],
 quiz:[
  {q:'Which do you test first?',o:['Design','Operating effectiveness','Neither'],a:0,e:'If design fails there is no need to test operation.'},
  {q:'A walkthrough follows...',o:['One transaction end to end','Every transaction','The org chart'],a:0,e:'It supports your understanding of design.'},
  {q:'A good workpaper can be...',o:['Re-performed by someone else','Understood only by its author','Verbal'],a:0,e:'Re-performance is the standard.'},
  {q:'What happens to "minor" exceptions in a workpaper?',o:['Evaluated and described specifically','Left vague','Deleted'],a:0,e:'Every exception needs an evaluation.'}]},

{id:'2.5',wk:W2T,title:'Handling an exception and a control owner who pushes back (Q8 and Q9)',time:'about 2.5 hours',
 learn:[
  {h:'The exception routine (Q8)',p:'1 <b>Confirm</b> it with the control owner, with a deadline. 2 <b>Document</b> immediately. 3 Find the <b>root cause</b>: one-off or systemic? 4 <b>Extend the sample or conclude</b>, per methodology. 5 Consider <b>compensating controls</b> and dependent controls. 6 <b>Escalate to the lead the same day</b> with options. And never accept after-the-fact evidence made to cover the gap.'},
  {h:'Pushback (Q9)',p:'Use a story: situation, action, result. <b>Prepare evidence</b> before the meeting. Start with the shared goal. Be fact-based and respectful. <b>Accept valid new evidence</b>. Agree root cause and fix. Keep your lead informed.'}],
 why:'These are behavioural questions with a technical core. The interviewer is watching your composure, judgement and honesty.',
 sim:[],files:[CX],
 lab:{intro:'Use the same file <b>'+CX+'</b> (sheet SAMPLE). You found 4 exceptions in 10.',tasks:[
  {q:'Three of the exceptions (2 missed reviews, 1 late) relate to the same reviewer. Who? Enter the reviewer name as in the sheet.',t:'txt',a:['m.diaz','mdiaz'],why:'M.DIAZ. That points to a root cause around that person, not random failure.'},
  {q:'The control has one reviewer and no backup. What is the most likely root cause of the missed weeks?',t:'mcq',o:['Nobody covers when M.DIAZ is absent: a design gap','Random mistakes','SAP malfunction'],a:0,why:'A systemic design gap, not one-off errors.'},
  {q:'Is this isolated or systemic?',t:'mcq',o:['Isolated','Systemic: it will recur whenever the reviewer is absent','Cannot be said'],a:1,why:'It will happen again. That affects your conclusion.'},
  {q:'FIRST step on finding the first exception?',t:'mcq',o:['Report a deficiency to the audit committee','Confirm with the control owner with a deadline, then document','Change the sample'],a:1,why:'Confirm facts, then document, then escalate.'},
  {q:'The control owner offers to sign the missing review reports today, dated last month. What do you do?',t:'mcq',o:['Accept them','Refuse: after-the-fact evidence cannot fix an exception; document the offer and tell your lead','Accept half'],a:1,why:'It would be falsified evidence. Do not accept it.'},
  {q:'The owner says "I always review, I just do not sign". Best response?',t:'mcq',o:['Argue until she gives in','Agree the shared goal, ask for any other evidence such as emails, accept what is valid, keep the rest as exceptions','Drop the finding'],a:1,why:'Fact-based, open to evidence, and holding firm where the evidence is missing.'}]},
 tb:[{n:8},{n:9}],
 quiz:[
  {q:'What do you do the same day you confirm an exception?',o:['Escalate to your lead with options','Wait for the report','Delete the sample'],a:0,e:'Do not sit on a confirmed exception.'},
  {q:'Root cause tells you...',o:['Whether it is isolated or systemic','The weather','Who to fire'],a:0,e:'It guides whether to extend the sample and how to conclude.'},
  {q:'In a pushback story you should use...',o:['Situation, action, result','A list of names','Only emotions'],a:0,e:'Structure shows judgement.'},
  {q:'Can compensating controls reduce the impact of an exception?',o:['Yes, if they truly address the risk','Never','Only for IT'],a:0,e:'But they must be tested too.'}]},

{id:'2.6',wk:W2T,title:'Sampling and relying on system reports (Q33 and Q34)',time:'about 3.5 hours',
 learn:[
  {h:'Sample size and selection (Q33)',p:'The methodology sets size by <b>frequency and risk</b>. A common table: annual 1, quarterly 2, monthly 2 to 5, weekly 5 to 15, daily 20 to 40, many times a day 25 to 60. <b>Automated controls</b>: one per scenario plus confirm the configuration did not change. Select randomly or <b>systematically</b> (every nth item) from a <b>complete population</b>, record the method, cover the <b>whole period</b>.'},
  {h:'Reports as evidence: IPE (Q34)',p:'A report from the client is <b>information produced by the entity</b>. You must show it is complete and accurate: how produced, the <b>parameters</b> (observe or re-run), <b>completeness</b> agreed to an independent total (such as the general ledger), <b>accuracy</b> traced both ways, and for custom reports the <b>logic</b> (or change control over it).'}],
 why:'Q34 is where many candidates stumble: they use the client\'s report without testing it. This unit shows how an incomplete report looks in the data.',
 sim:[
  {s:SCR.easy,say:'Type ZFI_AP_OPEN_ITEMS to run the client\'s custom report.',a:{k:'cmd',v:'ZFI_AP_OPEN_ITEMS'}},
  {s:SCR.zrepI,say:'Read the parameters before running. The company code range stops at 1200. Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.zrepR,say:'Note the total. Now check it against the general ledger. Type /nFAGLB03.',a:{k:'cmd',v:'FAGLB03'}},
  {s:SCR.faglbI,say:'Type the AP control account 160000.',a:{k:'type',id:'fAcct',v:'160000'}},
  {s:SCR.faglbI,say:'Click Execute.',a:{k:'click',id:'bExec'}},
  {s:SCR.faglbR,say:'The ledger has company code 1300 and the report does not. The report is incomplete. Click Next.',a:{k:'read'}}],
 files:[IX],
 lab:{intro:'Open <b>'+IX+'</b>. <b>JOURNAL_POPULATION</b> holds 200 journals for a control that runs many times a day. <b>AP_OPEN_ITEMS_REPORT</b> is the client\'s report. <b>GL_AP_CONTROL_ACCOUNT</b> is the ledger balance per company code.',tasks:[
  {q:'How many journals are in the population?',t:'num',a:ANS.s_pop,why:'Always agree the population count to an independent source.'},
  {q:'A control that runs many times a day: which sample size fits a common table?',t:'mcq',o:['1','25 to 60','2'],a:1,why:'Many times a day: 25 to 60, higher with higher risk or planned reliance.'},
  {q:'With a population of 200 and a sample of 25, what is the systematic selection interval?',t:'num',a:ANS.s_interval,why:'200 divided by 25 = 8. Pick a start point and take every 8th.'},
  {q:'Starting at row 3 with that interval, what is the JE_NUMBER of the 3rd item selected (row 3, 11, 19)?',t:'num',a:ANS.s_third,why:'Row 19 in the JOURNAL_POPULATION sheet.'},
  {q:'What is the total of the AP_OPEN_ITEMS_REPORT amounts?',t:'num',a:ANS.ipe_report,why:'Sum the AMOUNT column. Two decimals.'},
  {q:'What is the total ledger balance in GL_AP_CONTROL_ACCOUNT?',t:'num',a:ANS.ipe_gl,why:'Sum GL_BALANCE.'},
  {q:'What is the difference (ledger minus report)?',t:'num',a:ANS.ipe_diff,why:'The report is short by this amount.'},
  {q:'Which company code is missing from the report? Enter the code.',t:'txt',a:[ANS.ipe_missing],why:'The report parameters stopped at 1200, so 1300 was left out. A filtered-out entity is a classic IPE completeness failure.'},
  {q:'Can you rely on this report as it stands?',t:'mcq',o:['Yes, the totals look close','No: it is incomplete. Get a corrected report or re-run it with the right parameters','Yes, if the client signs it'],a:1,why:'Completeness failed. Re-run with correct parameters, then agree again to the ledger.'}]},
 tb:[{n:33},{n:34}],
 quiz:[
  {q:'What drives sample size for a manual control?',o:['Frequency and risk','The auditor\'s mood','File size'],a:0,e:'Methodology tables key off frequency and risk.'},
  {q:'How many instances do you test for an automated control with effective ITGCs?',o:['One per scenario plus configuration unchanged','Fifty','None'],a:0,e:'Automated controls behave consistently.'},
  {q:'How do you test completeness of a report?',o:['Agree it to an independent total','Read it','Ask the author'],a:0,e:'For example the general ledger balance.'},
  {q:'Why note the report parameters?',o:['Filters can exclude data without anyone noticing','They look professional','They set the font'],a:0,e:'A filter can hide a whole company code.'}]}
];
